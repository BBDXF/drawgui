# drawgui theme token schema - the compile-time contract (design.md section
# 5.7.1). The single source of truth for WHICH tokens exist, generated by
# tools/gen_theme.py into:
#
#   include/drawgui/theme/token_ids.generated.h  uint16_t token_id constants
#   src/theme/token_table.generated.inc          the loader's name->id table
#   doc/theme-tokens.generated.md                a generated reference table
#
# This mirrors props/drawgui.props.toml + tools/gen_props.py exactly in shape
# (design.md section 5.7.7): a schema is a contract, not data, and the same
# drift class that once split stonegui's tokens across four files is what
# this generator/lock pair removes here too.
#
# WHAT THIS FILE DOES NOT DO: it does not say what a token EQUALS. That is
# runtime data, in a theme.json (design.md section 5.7.1's whole point);
# themes/builtin/theme.json is this project's one shipped instance, embedded
# as a string (design.md section 5.7.4). tools/check_consistency.py verifies
# that JSON covers every token declared here.
#
# NUMBERING IS AN ABI CONTRACT, identical to props/drawgui.props.toml's rule:
# `id` is a uint16_t, assigned explicitly, APPEND-ONLY. id 0 is reserved for
# DG_TOKEN_INVALID. An id is never reused or renumbered - themes/token_ids.lock
# guards that the same way props/prop_ids.lock guards prop_id.
#
# FIELD REFERENCE:
#
#   name      required. dotted lower-kebab, matches ^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$
#             The generated constant is DG_TOKEN_<NAME with '.'/'-' -> '_', uppercased>.
#   id        required. uint16_t, see numbering rules above.
#   type      required. One of:
#               color   - a semantic colour, varies PER VARIANT (light/dark);
#                         lives in theme.json's "variants" table
#               int     - a device-pixel integer (radius/spacing/font-size);
#                         does NOT vary per variant - lives in theme.json's
#                         "base" table (design.md section 5.7.4's own example)
#             Design.md section 5.7.2's "dichotomy" - no third type exists,
#             and there is deliberately no expression/alpha-modifier syntax
#             (section 5.11.4): a hover/pressed variant of a colour is its
#             own token (color.primary-hover), not primary with an opacity
#             expression applied to it.
#   group     required. Documentation grouping only ("color", "radius", "space").
#   summary   required. One-line human description.
#
# TOKEN MODEL SCOPE (design.md section 5.7.2, kept deliberately small but
# real per this slice's task): semantic colour tokens plus integer tokens.
# Pseudo-states are represented as their OWN colour tokens
# (color.primary-hover, color.primary-pressed) rather than as a nesting
# syntax - the one-level-nesting-ceiling design.md names is satisfied by
# having no nesting at all yet, because nothing in this slice's scope needs
# a `button.background` PART token; the ceiling is documented in doc/theme.md
# as the thing a future widget-theming slice would use, not built here ahead
# of a second consumer (this project's own standing rule).

schema_version = 1

[meta]
# The id the next new token must take. Bump it when appending.
next_id = 13

# ---------------------------------------------------------------------------
# Colour tokens - variant-dependent (light/dark). design.md section 5.11.4:
# a "same colour, different opacity" state (Material's state layers) is
# EXPLICITLY not built as an expression; color.primary-hover/-pressed exist
# as their own tokens instead, with light/dark values written out in full.
# ---------------------------------------------------------------------------

[[token]]
name = "color.surface"
id = 1
type = "color"
group = "color"
summary = "The default background a panel/window paints - NodeStyle::fill's usual source."

[[token]]
name = "color.on-surface"
id = 2
type = "color"
group = "color"
summary = "Text/icon colour painted on top of color.surface."

[[token]]
name = "color.border"
id = 3
type = "color"
group = "color"
summary = "The default border colour for a framed panel."

[[token]]
name = "color.primary"
id = 4
type = "color"
group = "color"
summary = "The accent colour for a primary action (a button's fill, say)."

[[token]]
name = "color.on-primary"
id = 5
type = "color"
group = "color"
summary = "Text/icon colour painted on top of color.primary."

[[token]]
name = "color.primary-hover"
id = 6
type = "color"
group = "color"
summary = "color.primary's hovered state - a distinct token per section 5.11.4, not an alpha expression."

[[token]]
name = "color.primary-pressed"
id = 7
type = "color"
group = "color"
summary = "color.primary's pressed state - a distinct token per section 5.11.4, not an alpha expression."

# ---------------------------------------------------------------------------
# Integer tokens - variant-INDEPENDENT (design.md section 5.7.4's own
# example: "base": { "radius.md": 8, ... }). Device pixels, exactly what
# dg::set_prop()'s length/float appliers already expect (node_props.cpp's
# to_pixels()).
# ---------------------------------------------------------------------------

[[token]]
name = "radius.sm"
id = 8
type = "int"
group = "radius"
summary = "A small corner radius - chips, small controls."

[[token]]
name = "radius.md"
id = 9
type = "int"
group = "radius"
summary = "The default corner radius for a panel or a button."

[[token]]
name = "space.sm"
id = 10
type = "int"
group = "space"
summary = "A small spacing unit - tight gaps, small padding."

[[token]]
name = "space.md"
id = 11
type = "int"
group = "space"
summary = "The default spacing unit - ordinary gaps and padding."

# ---------------------------------------------------------------------------
# 7-4: the focus ring. A colour token, not an int, and out of numbering order
# with the two groups above only in the sense that it was appended after
# both existed - id 12 is still the next free id, ascending, append-only.
# ---------------------------------------------------------------------------

[[token]]
name = "color.focus-ring"
id = 12
type = "color"
group = "color"
summary = "The keyboard focus indicator (7-4) - a visible ring outset around whichever widget dg::Focus currently names, read directly via Theme::color_value() rather than through a $token live binding (doc/focus.md section 5: the ring is paint/positioning state with no LayoutTree node of its own, the same shape TextField's caret/selection_highlight already are)."
