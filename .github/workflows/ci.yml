# design.md section 7 and constraint C4: CI, formatter, linter and regression
# tests are in place before the first widget. The retrospective this project
# inherits from records that deleting the tooling left no defence at all.
#
# Windows is in scope per design.md section 3 but has no job yet: libskia2
# (cmake/FetchSkia2.cmake, P7 slice 7-1) publishes a windows-x64-msvc
# tarball with its own SHA256 sidecar, but FetchSkia2.cmake deliberately
# only maps the linux-x64 triple today - wiring up an MSVC job (and the
# CMake triple mapping + pin it would need) is out of scope for 7-1 by name.
# A job would be red by construction otherwise, so it is added together with
# the mapping rather than before it. See doc/skia-dependency.md section 7.

# The build and sanitize matrices are gcc-only, halving CI wall-clock at the
# owner's request. No job uses clang any more: the clang-tidy job was removed
# in the same pass (see below), and clang-format is its own package.
#
# One documented property loses its continuous check by the gcc-only matrices:
# the golden images are byte-identical across gcc AND clang, which is what
# makes zero-tolerance pixel comparison defensible. That is still true and is
# still the reason for zero tolerance, but only the gcc half is verified on
# every push now. Restore a clang build job if a golden baseline is ever
# suspected of being compiler-dependent.
#
# clang-tidy was REMOVED, and this is a deliberate departure from constraint
# C4 and design.md section 7, both of which name it. Recorded rather than
# quietly dropped, because C4's own stated rationale is "delete the tooling
# and there is no defence left". What the removal actually cost, measured
# rather than guessed:
#
#   - It was a real gate. Its last run found four genuine
#     bugprone-unchecked-optional-access defects in tests/unit/test_complex_props.cpp.
#   - It was also a real tax. Of the 31 commits mentioning it, most are
#     "add slice N's files to the hand-maintained clang-tidy TU list" - per-slice
#     maintenance, not findings.
#   - The hand-kept list had silently drifted: 195 first-party translation
#     units exist in compile_commands.json, 187 were listed, so 8 were never
#     linted by a gate that appeared to cover everything.
#
# .clang-tidy is KEPT so the checks can still be run locally on demand
# (doc/development.md says how). It is no longer enforced by anything.
# gcc -Werror and the ASan+UBSan job remain; neither catches the
# unchecked-optional-access class, which is what this removal gives up.

name: CI

name: CI

on:
  # master, not main - this repository's default branch. Listening on a branch
  # that does not exist is a workflow that never runs, silently.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux / gcc / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libfreetype-dev libfontconfig1-dev

      # Allowed to be absent. libsdl3-dev first appears in the Ubuntu archive
      # in questing (25.10) and the runner image is older, so on today's image
      # this is a no-op and the multi-window backend plus examples/01_sdl3_multi_window
      # are simply not built - CMake says so in its configure output. When the
      # image catches up they start building here with no further change. This
      # cannot fake a passing test: there is no CTest entry for the demo, only
      # a target that either compiles or is absent.
      - name: Install SDL3 (optional)
        run: sudo apt-get install -y --no-install-recommends libsdl3-dev || true

      # libskia.a references FreeType unconditionally, and the prebuilt
      # archive plus the pinned headers are large enough that re-fetching them
      # on every run is wasteful. The key covers every pin in FetchSkia2.cmake,
      # so changing a pin invalidates the cache rather than silently reusing
      # the previous artifact.
      - name: Cache Skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-prebuilt
          key: skia-${{ runner.os }}-${{ hashFiles('cmake/FetchSkia2.cmake') }}

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDRAWGUI_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A failed golden comparison writes the actual and diff images. Without
      # them a CI-only pixel regression is undebuggable.
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-output-gcc-${{ matrix.build_type }}
          path: build/tests/golden-output/
          if-no-files-found: ignore

  sanitize:
    name: sanitize / gcc / ASan+UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libfreetype-dev libfontconfig1-dev

      # Allowed to be absent. libsdl3-dev first appears in the Ubuntu archive
      # in questing (25.10) and the runner image is older, so on today's image
      # this is a no-op and the multi-window backend plus examples/01_sdl3_multi_window
      # are simply not built - CMake says so in its configure output. When the
      # image catches up they start building here with no further change. This
      # cannot fake a passing test: there is no CTest entry for the demo, only
      # a target that either compiles or is absent.
      - name: Install SDL3 (optional)
        run: sudo apt-get install -y --no-install-recommends libsdl3-dev || true

      - name: Cache Skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-prebuilt
          key: skia-${{ runner.os }}-${{ hashFiles('cmake/FetchSkia2.cmake') }}

      # Debug rather than Release on purpose. UBSan's checks are emitted before
      # optimisation and an optimiser is entitled to delete the ones it can
      # prove unreachable, so -O0 is the configuration that sees the most.
      # DG_SANITIZE forces -g independently of the build type, so the traces
      # carry line numbers either way.
      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDRAWGUI_WERROR=ON \
            -DDG_SANITIZE=ON

      - name: Build
        run: cmake --build build

      # No ASAN_OPTIONS / UBSAN_OPTIONS here: tests/CMakeLists.txt sets what
      # the instrumented entries need as a CTest property, so a local run and
      # a CI run cannot disagree about it.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-output-sanitize-gcc
          path: build/tests/golden-output/
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      # Generated files are excluded: their formatting is the generator's
      # responsibility, and props.no_drift already guards their content.
      # drawgui.h/drawgui_abi.generated.cpp have no "generated" infix on the
      # HEADER's own name (it is the ABI deliverable a real host includes,
      # <drawgui/abi/drawgui.h>, not an internal generated-file convention),
      # but both still pass this check unmodified: tools/gen_abi.py's own
      # output is written to already match .clang-format (verified against
      # a real clang-format run, not assumed), so nothing needed excluding.
      - name: Check formatting
        run: |
          files=$(find include src tests examples -name '*.cpp' -o -name '*.h' \
                  | grep -v generated | sort)
          echo "$files"
          clang-format --style=file --dry-run --Werror $files

  generated:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # design.md section 5.8 decision 5: props/drawgui.props.toml is the
      # single source of truth. The stonegui retrospective traces a whole
      # class of bugs to four copies of the same table drifting apart.
      - name: Check property generation
        run: python3 tools/gen_props.py --check

      # design.md section 5.8 decision 4: a prop_id is an ABI contract -
      # append-only, never reused, never renumbered. The step above would
      # regenerate cheerfully after a renumber; this one refuses to.
      - name: Check property id lock
        run: python3 tools/prop_lock.py --check

      # The step above runs the lock against a correct table, which is the one
      # input that cannot tell a working check from one that always returns 0 -
      # and returning 0 for an unrecorded append is exactly what the first
      # version of prop_lock.py did. This feeds it broken tables on purpose.
      - name: Check the property id lock still rejects tampering
        run: python3 tools/prop_lock_selftest.py

  identity:
    name: commit identity
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because this checks EVERY commit, not just the tip.
      # A shallow clone would let an older bad commit ride in unexamined,
      # which is the case a force-push is most likely to introduce.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repository's history was once rewritten wholesale to remove an
      # employer address that a machine's global git identity had written into
      # 184 of 185 commits. .githooks/pre-commit refuses the first wrong commit
      # locally, but a client-side hook is skipped by `--no-verify` and does not
      # travel with a clone. This job is the check that cannot be bypassed by
      # the person making the commit, so it is the one that actually holds.
      #
      # Author AND committer are both checked: a rebase, an amend or a
      # cherry-pick rewrites the committer while leaving the author alone, so
      # checking only one leaves half the surface open.
      - name: Every commit is authored by this repository's identity
        run: |
          expected='BBDXF <4433613+BBDXF@users.noreply.github.com>'
          bad=0
          while IFS='|' read -r sha author committer; do
            if [ "$author" != "$expected" ]; then
              echo "::error::$sha author is '$author', expected '$expected'"
              bad=1
            fi
            if [ "$committer" != "$expected" ]; then
              echo "::error::$sha committer is '$committer', expected '$expected'"
              bad=1
            fi
          done <<< "$(git log --format='%H|%an <%ae>|%cn <%ce>')"
          if [ "$bad" -ne 0 ]; then
            echo "Rewriting published history is the only fix once this lands," >&2
            echo "which is why .githooks/pre-commit exists. Enable it with:" >&2
            echo "  git config core.hooksPath .githooks" >&2
            exit 1
          fi
          echo "$(git rev-list --count HEAD) commits, all correctly attributed."
