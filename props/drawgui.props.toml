# margin is parentData, but unlike grow/left it sits on the ParentData BASE
# class: every container applies it through layout_child_with_margin()
# (section 5.9.4). No margin collapsing; adjacent margins add.

[[property]]
name = "margin_l"
id = 12
type = "float"
group = "box_model"
field = "margin_l"
parent_data = true
parent_data_scope = "base"
consumed_by = ["flex", "wrap", "stack"]
summary = "Left outer spacing applied by the parent, excluded from size."

[[property]]
name = "margin_t"
id = 13
type = "float"
group = "box_model"
field = "margin_t"
parent_data = true
parent_data_scope = "base"
consumed_by = ["flex", "wrap", "stack"]
summary = "Top outer spacing applied by the parent, excluded from size."

[[property]]
name = "margin_r"
id = 14
type = "float"
group = "box_model"
field = "margin_r"
parent_data = true
parent_data_scope = "base"
consumed_by = ["flex", "wrap", "stack"]
summary = "Right outer spacing applied by the parent, excluded from size."

[[property]]
name = "margin_b"
id = 15
type = "float"
group = "box_model"
field = "margin_b"
parent_data = true
parent_data_scope = "base"
consumed_by = ["flex", "wrap", "stack"]
summary = "Bottom outer spacing applied by the parent, excluded from size."

