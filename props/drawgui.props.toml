# per-frame interaction state (like hover/press), not a declarative style, so
# it lives in WidgetSet and on RenderTree::set_scroll_offset rather than in
# this table. See doc/scrolling.md section 2.
# ---------------------------------------------------------------------------

[[property]]
name = "scroll_axis"
id = 46
type = "enum"
values = ["none", "vertical", "horizontal"]
group = "container"
field = "scroll_axis"
applies_to = ["box"]
summary = "Which axis, if any, this node hands its child an unbounded constraint on."
