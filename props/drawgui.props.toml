# drawgui property definitions - the single source of truth.
#
# Everything that knows about a property is generated from this file by
# tools/gen_props.py. Hand-writing a second copy of this data is what
# silently drifted the predecessor project across four files (design.md
# section 5.8 decision 5, section 5.7.7).
#
# NUMBERING IS AN ABI CONTRACT (design.md section 5.8 decision 4):
#
#   - `id` is a uint16_t, assigned explicitly here, APPEND-ONLY.
#   - id 0 is reserved for DG_PROP_INVALID and must not appear below.
#   - An id is NEVER reused and NEVER renumbered. Removing a property
#     retires its id forever (leave a gap and a comment); doing otherwise
#     is a MAJOR version break.
#   - New entries take `meta.next_id` and then bump it.
#   - Entries are listed in strictly ascending id order. The generator
#     enforces this so that "append-only" is visible in the diff.
#
# FIELD REFERENCE (a property table may gain new optional fields later
# without touching any existing id):
#
#   name              required. snake_case, matches ^[a-z][a-z0-9_]*$.
#                     The generated constant is DG_PROP_<NAME uppercased>.
#   id                required. uint16_t, see numbering rules above.
#   type              required. One of:
#                       float     - plain logical-pixel / unitless scalar
#                       length    - float that may also be a percentage of
#                                   the incoming max_* constraint; a
#                                   percentage under an unbounded
#                                   constraint is an error (section 5.4.5)
#                       color     - 0xAARRGGBB, unpremultiplied at the
#                                   boundary (section 5.11.3)
#                       enum      - one of `values`, below
#                       gradient  - NOT a scalar; dedicated setter
#                       shadow    - NOT a scalar; dedicated setter
#                       transform - NOT a scalar; dedicated setter
#                     The three complex types cannot travel in the scalar
#                     tagged union and take dg_node_set_* setters of their
#                     own (section 5.9.5).
#   values            required for type = "enum", forbidden otherwise.
#   group             required. Documentation grouping only.
#   field             required. The concrete struct member the dispatch
#                     switch assigns into (section 5.15.3 - there is no
#                     per-node map).
#   applies_to        required when parent_data = false. Node kinds that
#                     own the field. "box" means RenderBox and every
#                     RenderObject deriving from it (flex, wrap, stack).
#   parent_data       optional, default false. True when the property is
#                     set on the CHILD but consumed by the PARENT, so
#                     validation defers to layout time and a mismatch must
#                     produce a diagnostic carrying a node path, never a
#                     silent ignore (section 5.8 decision 7).
#   parent_data_scope required when parent_data = true, forbidden
#                     otherwise. One of:
#                       base  - lives on the ParentData BASE class because
#                               every container must handle it
#                               (section 5.9.4: margin)
#                       flex  - lives on FlexParentData
#                       stack - lives on StackParentData
#   consumed_by       required when parent_data = true, forbidden
#                     otherwise. Container kinds that read the field.
#   optional          optional, default false. True when the field is an
#                     absent-able value (std::optional) rather than one
#                     with a meaningful zero.
#   summary           required. One-line human description.

schema_version = 1

[meta]
# The id the next new property must take. Bump it when appending.
next_id = 47
node_kinds = ["box", "flex", "wrap", "stack"]

# ---------------------------------------------------------------------------
# Box model - constant border-box: width/height = border + padding + content,
# margin excluded (section 5.9.4).
# ---------------------------------------------------------------------------

[[property]]
name = "width"
id = 1
type = "length"
group = "box_model"
field = "width"
applies_to = ["box"]
optional = true
summary = "Border-box width; absent means shrink-to-fit."

[[property]]
name = "height"
id = 2
type = "length"
group = "box_model"
field = "height"
applies_to = ["box"]
optional = true
summary = "Border-box height; absent means shrink-to-fit."

[[property]]
name = "min_width"
id = 3
type = "length"
group = "box_model"
field = "min_width"
applies_to = ["box"]
summary = "Lower clamp applied after the size source resolves."

[[property]]
name = "max_width"
id = 4
type = "length"
group = "box_model"
field = "max_width"
applies_to = ["box"]
summary = "Upper clamp applied after the size source resolves."

[[property]]
