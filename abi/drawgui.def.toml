# =============================================================================
# drawgui.def.toml - the single source of truth for the C ABI (design.md
# section 5.8 decision 5).
#
# tools/gen_abi.py turns this file into:
#
#   include/drawgui/abi/drawgui.h        a pure C header - no C++, no Skia
#   src/abi/drawgui_abi.generated.cpp    the extern "C" trampolines: every one
#                                        wraps its call in the SAME try/catch
#                                        shape (design.md section 5.17.1) so
#                                        that wrapping cannot be forgotten for
#                                        a newly added function
#   abi/drawgui.d.ts                     TypeScript ambient declarations for a
#                                        future Bun/Node FFI binding (P6)
#
# "Hand-writing any one of them causes drift" (design.md section 5.8 decision
# 5) - so none of the three above is hand-written. What IS hand-written is
# src/abi/*.cpp: for every [[function]] below, `impl` names a plain C++
# function (namespace dg::abi, declared in src/abi/abi_impl.h) with the
# IDENTICAL C signature, free to throw, that the generated trampoline calls
# inside its try block. The generator produces the boundary; a person writes
# what happens on the C++ side of it - the same split node_props.h documents
# for prop_dispatch.generated.inc (the generator produces the switch, a
# person writes what each case assigns).
#
# THIS FILE MODELS ITSELF ON THE TWO WORKING PRECEDENTS,
# props/drawgui.props.toml and themes/schema.toml, and tools/gen_abi.py
# imports both of THEIR loaders directly (tools/gen_props.py's and
# tools/gen_theme.py's load_definitions()) rather than re-parsing
# props/drawgui.props.toml or themes/schema.toml a second time - the
# prop_id/token_id constants this file's generated header re-emits in
# C-compatible #define form come from the SAME validated Definitions objects
# those two tools already produce, so there is exactly one parser and one set
# of validation rules per source table, never two.
#
# ABI STABILITY (design.md section 5.8 decision 4), enforced MECHANICALLY by
# tools/abi_lock.py against abi/drawgui_abi.lock, not by discipline:
#
#   functions   locked by (name, normalized signature). A name may only be
#               ADDED, never removed or re-signed.
#   structs     locked by (name, ordered field list). A struct's locked
#               fields must remain an unchanged PREFIX of its current field
#               list - new fields may only be APPENDED at the end. Every
#               struct below carries `size` as its first field for exactly
#               this reason (a caller passing an old, shorter struct is
#               detected rather than read out of bounds).
#   constants   (node_type / value_type / event_kind / error), locked by
#               (name, value) exactly like props/prop_ids.lock and
#               themes/token_ids.lock. A value may only be ADDED, never
#               renumbered or reused.
#   opaque_type locked by name only - a type may be added, never removed or
#               renamed (renaming is observable at the ABI: the mangled
#               struct tag changes).
#
# WHAT IS DELIBERATELY NOT HERE, named rather than silently absent
# (reasoning for each below):
#
#   dg_set_event_callback     - decision 2's QuickJS/native-embedding mode.
#                               No host in this project embeds QuickJS yet,
#                               so there is no working caller to extract the
#                               interface from - the exact situation design.md
#                               itself already names as this project's
#                               standing mistake to avoid (the twelve deleted
#                               platform headers).
#   dg_custom_paint_set_cmds  - decision 3's escape hatch. Not on the
#                               two-window-plus-click acceptance path.
#   dg_animate /
#   dg_node_set_transition    - section 5.16.1's animation ABI. The C++ shape
#                               (dg::AnimationEngine) exists since 6-1, but
#                               nothing in this slice's own acceptance
#                               criterion needs it, and wiring an
#                               AnimationEngine per window into the trampoline
#                               layer ahead of a caller is the same mistake.
#   dg_theme_load_dir /
#   dg_theme_load_memory /
#   dg_theme_set_variant /
#   dg_theme_override /
#   dg_app_set_theme          - 7-6 LANDS THIS (see [[opaque_type]] dg_theme_t
#                               and the [[function]] entries below): a real
#                               C caller (examples/24_theme_package) now
#                               loads an external, untrusted theme package
#                               directory, binds a node's property to a
#                               token via dg_node_set_prop()'s own new
#                               DG_VALUE_TOKEN value kind (reusing the
#                               EXISTING door rather than adding a second
#                               bind_token()-shaped function), and switches
#                               variant/reloads live.
#   QuickJS binding stubs     - P6. Described in design.md decision 5 as a
#                               fourth generated artifact; there is no QuickJS
#                               embedding anywhere in this project to bind.
#   Widget::group (radio)     - P6 sub-step a2: DG_NODE_TYPE_CHECKBOX exports
#                               dg::WidgetKind::kCheckbox but deliberately
#                               never dg::Widget::group, so there is no
#                               dg_node_set_prop() path to turn one into a
#                               radio button. Two reasons, not one: (1) no
#                               caller on this ABI's own acceptance path (P6's
#                               pure-C TodoMVC) needs a radio group; (2)
#                               widget_set.h's own contract for a GROUPED
#                               toggle's toggle() is that it reports only the
#                               clicked member's own `checked` bit back -
#                               it does NOT repaint the other group members
#                               it may have just deselected (see
#                               WidgetSet::group_members()'s own comment) -
#                               a caller has to notice this and repaint every
#                               sibling itself (examples/11_form_controls/
#                               form_scene.cpp's dispatch() does exactly
#                               that). Get this wrong at the ABI boundary and
#                               the bug is invisible to dg_dump_layout_tree()
#                               (the STATE is correct - only the PIXELS are
#                               wrong), which is exactly the failure mode
#                               golden images exist to catch and dumps
#                               cannot. Leaving `group` unexported removes the
#                               failure mode instead of documenting around
#                               it. PREREQUISITE to add it: a real caller that
#                               needs mutually-exclusive selection, at which
#                               point that caller's own repaint-the-siblings
#                               call is what this ABI would wrap.
#   dg_app_bind_shortcut      - design.md section 5.5.3's runtime-rebinding
#                               signature (dg_app_t*, const dg_shortcut*,
#                               uint16_t). 8-1 made the binding table
#                               GENERATED at build time from
#                               input/shortcuts.toml, and every shipped
#                               action already has a binding there - there is
#                               no host anywhere in this project that needs a
#                               chord DIFFERENT from the generated table, so
#                               a C `dg_shortcut` struct here would be ABI
#                               surface invented for a caller that does not
#                               exist, the identical mistake this file's own
#                               QuickJS/animation/window-destroy declines
#                               above already name. PREREQUISITE: a host that
#                               genuinely needs a binding the generated table
#                               does not provide - a user-configurable
#                               keymap is the obvious one - which would be
#                               the working caller this function is
#                               extracted FROM, not written ahead of. See
#                               design.md section 5.5.3 for the signature
#                               this leaves unbuilt.
#   IME composition surface   - P6 sub-step a2 (second half): no
#                               dg_node_composition_*()/DG_EVENT_COMPOSITION_*
#                               of any shape, and DG_NODE_TYPE_TEXT_FIELD's
#                               composition_underline child is built but never
#                               driven (see that constant's own entry above).
#                               Reason: doc/limitations.md's own R6 records
#                               that 7-3's preedit byte-offset conversion "has
#                               never been verified against a real CJK/Japanese
#                               IME composing a word" - every existing test is
#                               a synthetic dg::TextEditingEvent this project
#                               constructed itself, never a real ibus/fcitx/
#                               Windows TSF session. Exporting a C surface for
#                               that untested path, on TOP of the untested
#                               path itself, is the wrong order: a caller
#                               embedding this ABI has no way to tell
#                               "committed text works" (this slice's own
#                               dg_debug_post_text_input()/DG_EVENT_TEXT_CHANGED,
#                               both real, both tested) from "composition
#                               preview offsets are correct" (never real-IME
#                               tested at any layer, C++ included) if both
#                               ship under the same ABI stability promise.
#                               PREREQUISITE: R6 resolved in the C++ layer
#                               first - a real IME run, not a synthetic event -
#                               at which point exporting it is this file's
#                               job, not a design question.
#
# 8-3d ALSO fixes a summary that this landing makes false rather than
# leaving it stale: dg_event::node used to read "DG_EVENT_CLICK only; null
# otherwise" - DG_EVENT_ACTION now uses the SAME field for its resolved
# target node (null for an app-scope action, per design.md section 5.5.2's
# level 4). See the [[struct]] dg_event entry below for the corrected text.
#
# DEBUG-ONLY FUNCTIONS (dg_debug_*) are a deliberate, narrow, named exception
# to "只导出必要面" (design.md section 5.8's own design principle): they exist
# ONLY so that examples/19_c_client's own CTest oracle can drive a REAL click
# through the REAL SDL event queue without a display, mirroring the exact
# mechanism (WindowManager::warp_pointer / post_pointer_button) every other
# example's own --script mode already uses in C++. They are not part of the
# production surface a real host embeds against.
# =============================================================================

schema_version = 1

# VERSION HISTORY. MINOR is bumped once per batch of append-only additions
# (design.md section 5.8 decision 4); doc/reference/c-abi.md section 7 keeps
# the same list for readers of the header rather than of this file.
#
#   0.1  the initial surface (94d53af) through dg_node_get_text().
#   0.2  dg_node_insert_before() positions/moves and dg_node_remove() removes
#        whole subtrees (5f3917b); DG_PROP_DISABLED + DG_VALUE_BOOL (e8bdea9);
#        disabled widgets follow theme switches (c488360); window operations
#        (dg_window_set_title() .. dg_window_get_state()), DG_EVENT_WINDOW_*
#        state events, DG_PIXEL_FORMAT_*, DG_WINDOW_STATE_*, and
#        dg_window_opts' resizable/min/max fields; DG_PROP_CURSOR + the
#        C-side enum value constants (DG_CURSOR_* and every other enum
#        property's DG_<PROP>_<VALUE>), and dg_debug_get_cursor();
#        DG_PROP_SCROLLBAR + DG_SCROLLBAR_AUTO/ALWAYS/NEVER and the
#        scrollbar theme tokens (DG_TOKEN_COLOR_SCROLLBAR_*,
#        DG_TOKEN_SIZE_SCROLLBAR); DG_NODE_TYPE_TEXT_AREA (multi-line editor,
#        reusing dg_node_set_text/dg_node_get_text/DG_EVENT_TEXT_CHANGED) and
#        dg_debug_post_text_field_key()'s Up/Down/Enter/PageUp/PageDown.
[meta]
abi_major = 0
abi_minor = 2

# --- Opaque handle types -----------------------------------------------------
#
# Every one of these is a pointer to a small, NEVER-FREED wrapper allocated
# once by the function that hands it out ({index, generation} - 8 bytes),
# never the resource itself. "Never freed" is load-bearing, not sloppy: a
# host dereferencing a handle after dg_node_remove()/dg_app_destroy() reads
# two ordinary, still-allocated integers rather than freed memory, so a
# stale-handle bug is an ordinary, ASan-silent DG_ERR_INVALID_HANDLE return
# instead of a real use-after-free, and 6-1's AnimHandle{index,
# generation} for the precedent this generalises from one resource kind
# (animation slots) to four (apps, windows, nodes, and node-arena entries).

[[opaque_type]]
name = "dg_app_t"
summary = "One drawgui application: the window manager and every window/node arena it owns."

[[opaque_type]]
name = "dg_window_t"
summary = "One OS window and the layout/render/widget state painted into it."

[[opaque_type]]
name = "dg_node_t"
summary = "One layout/render node - pending (not yet in a tree) or live (attached under a window)."

[[opaque_type]]
name = "dg_theme_t"
summary = "7-6: one loaded theme (a token->value table plus, optionally, the untrusted package directory it came from), owned by the app that loaded it."

# --- Structs -----------------------------------------------------------------
#
# Every struct's FIRST field is `size` (design.md section 5.8 decision 4):
# sizeof(the struct) as the caller's build understands it, so a future
# MINOR version that appends a field can tell an old, shorter caller-built
# struct from a current one instead of reading past the end of it.

[[struct]]
name = "dg_value"
summary = "One property value, tagged - the ABI's dg::PropValue (node_props.h)."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_value)." },
  { name = "type", type = "uint32_t", summary = "DG_VALUE_* - which field below is meaningful." },
  { name = "number", type = "float", summary = "meaningful for DG_VALUE_FLOAT / DG_VALUE_LENGTH." },
  { name = "bits", type = "uint32_t", summary = "ARGB for DG_VALUE_COLOR, ordinal for DG_VALUE_ENUM, 0/1 for DG_VALUE_BOOL." },
]

[[struct]]
name = "dg_app_opts"
summary = "Reserved for future app-level options. Empty today; `size` alone makes it extensible."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_app_opts)." },
]

[[struct]]
name = "dg_window_opts"
summary = "What a window should be when it appears - dg::WindowSpec at the ABI boundary."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_window_opts)." },
  { name = "title", type = "const char*", summary = "copied at dg_window_create() time; not retained." },
  { name = "width", type = "int32_t", summary = "initial width in device pixels." },
  { name = "height", type = "int32_t", summary = "initial height in device pixels." },
  { name = "background_argb", type = "uint32_t", summary = "0xAARRGGBB fill until the first frame paints." },
  { name = "resizable", type = "int32_t", summary = "ABI 0.2: nonzero lets the user resize the window. Read only when `size` covers it; an older, shorter struct gets 0 (not resizable), what every window was before." },
  { name = "min_width", type = "int32_t", summary = "ABI 0.2: minimum width, logical units; 0 = no limit. Read only when `size` covers it." },
  { name = "min_height", type = "int32_t", summary = "ABI 0.2: minimum height; 0 = no limit." },
  { name = "max_width", type = "int32_t", summary = "ABI 0.2: maximum width; 0 = no limit." },
  { name = "max_height", type = "int32_t", summary = "ABI 0.2: maximum height; 0 = no limit." },
]

[[struct]]
name = "dg_event"
summary = "One entry of dg_poll_events() - the C shape of dg::PumpResult, flattened to one kind at a time."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_event)." },
  { name = "kind", type = "uint32_t", summary = "DG_EVENT_*." },
  { name = "window", type = "dg_window_t*", summary = "which window this event is about." },
  { name = "node", type = "dg_node_t*", summary = "DG_EVENT_CLICK: the clicked node. DG_EVENT_ACTION: the resolved action's target node - design.md section 5.5.2 level 2, a focused node's own dg_node_scope_action() binding - or null for a level-4 app-wide action, which names no node. Null for every other kind." },
  { name = "x", type = "int32_t", summary = "DG_EVENT_CLICK: the pointer position, device pixels. DG_EVENT_WINDOW_MOVED: the new left edge, logical screen coordinates. DG_EVENT_WINDOW_RESIZED: the new drawable WIDTH, device pixels. 0 for every other kind, including DG_EVENT_ACTION." },
  { name = "y", type = "int32_t", summary = "DG_EVENT_CLICK: the pointer position, device pixels. DG_EVENT_WINDOW_MOVED: the new top edge, logical screen coordinates. DG_EVENT_WINDOW_RESIZED: the new drawable HEIGHT, device pixels. 0 for every other kind, including DG_EVENT_ACTION." },
  { name = "action_id", type = "uint16_t", summary = "8-3d: DG_EVENT_ACTION only - the resolved dg_action_id (input/shortcuts.toml, design.md section 5.5.3). DG_ACTION_INVALID (0) for every other kind. Appended at the end of the struct, after `y` - dg_event's own `size` field (design.md section 5.8 decision 4) is exactly the mechanism that makes this an allowed MINOR addition rather than a break; see abi/drawgui_abi.lock's own append-only rule." },
]

[[struct]]
name = "dg_theme_err"
summary = "7-6: out-param naming why dg_theme_load_dir()/dg_theme_load_memory() failed. The human-readable detail (a JSON key path or a byte offset) is dg_last_error(), matching every other failing call in this ABI; this struct carries only the machine-checkable status, so a host can branch on it without string-parsing dg_last_error()'s text."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_theme_err)." },
  { name = "status", type = "uint32_t", summary = "DG_THEME_ERR_* - mirrors dg::ThemeLoadStatus." },
]

# --- Constant groups -----------------------------------------------------------
#
# Every group emits plain `#define NAME value` constants, matching this
# project's own prop_id/token_id convention (never an enum: a value crossing
# the ABI arrives from outside the process, so the set it may hold is every
# value the underlying integer type can carry, not the set spelled out
# below - prop_ids.generated.h's own comment records the clang-tidy findings
# that made this the house rule, and the same reasoning applies unchanged
# here). Locked by tools/abi_lock.py exactly like props/prop_ids.lock:
# append-only, never renumbered, never reused.

[[constant_group]]
name = "node_type"
prefix = "DG_NODE_TYPE_"
c_type = "uint16_t"
summary = "dg_node_create()'s type_id - the minimum vocabulary the acceptance criterion needs."
values = [
  { name = "BOX", id = 1, summary = "A plain, non-interactive leaf (WidgetKind::kPanel)." },
  { name = "BUTTON", id = 2, summary = "A clickable leaf (WidgetKind::kButton): hover/press/click, three fills." },
  { name = "LABEL", id = 3, summary = "P6 sub-step a1: static text (WidgetKind::kLabel), not interactive - a click inside it belongs to whatever ancestor accepts it. Carries an engine-chosen default font (the app's dg_app_add_font() primary family) and size the instant it is created; dg_node_set_text(DG_PROP_TEXT) sets its string, dg_node_set_prop(DG_PROP_TEXT_COLOR) its colour." },
  { name = "CHECKBOX", id = 4, summary = "P6 sub-step a2: a clickable toggle (WidgetKind::kCheckbox) - unchecked by default, DG_EVENT_CLICK fires on a completed press+release exactly like DG_NODE_TYPE_BUTTON, and the click ALSO flips the checked bit (dg::WidgetSet::toggle()) before that event is queued, so a caller reacting to the click can immediately dg_node_get_checked() the new state. A caller-invisible INDICATOR CHILD is composed at attach time (examples/11_form_controls/form_scene.cpp's add_toggle() recipe, copied unchanged) to give the checked/unchecked fill somewhere to paint - it has no dg_node_t handle and cannot be reached, inserted into, or removed through this ABI; this is a deliberate trade, not an oversight, because a reactive framework built on this ABI (P6's own eventual c/d steps) cannot be made to hand-compose a child for every checkbox it creates. Widget::group (radio) is NOT exported - see this file's own \"WHAT IS DELIBERATELY NOT HERE\" entry for why." },
  { name = "TEXT_FIELD", id = 5, summary = "P6 sub-step a2 (second half): a single-line editable text field (WidgetKind::kTextField), examples/12_text_input's own recipe copied unchanged. A click focuses it (this ABI's existing dg::Focus, driven by process_pointer_event() exactly like every other focusable widget already is) and starts real text input on its window (WindowManager::start_text_input()); a committed SDL_EVENT_TEXT_INPUT then reaches it through dg_wait_events()/dg_poll_events()'s internal pump, which now also drains dg::PumpResult::text_input and calls dg::WidgetSet::text_field_insert(), queuing one DG_EVENT_TEXT_CHANGED per commit. Left/Right/Home/End/Backspace/Delete are dispatched directly by key, exactly like examples/12_text_input/text_field_window.cpp's own Runner::handle_key() - NOT through design.md section 5.5.2's four-level router: the router's ActionScope::kTextField only ever carries the four clipboard actions (copy/cut/paste/select_all, dg::clipboard_actions.h), never text_field_move/backspace/delete_forward, so there is no ActionId to resolve a caret move through and this ABI does not invent one. FOUR caller-invisible children are composed at attach time exactly like DG_NODE_TYPE_CHECKBOX's indicator (Widget::content/caret/selection_highlight/composition_underline) - none has a dg_node_t handle. `composition_underline` is built but never driven: this ABI exports no IME/composition surface at all (see this file's own \"明确不做\" entry below) - a field can never enter `composing`, so the underline stays zero-size forever, the same 'built but permanently dormant' shape as an ungrouped checkbox's unused Widget::group field. Read the field's current text with dg_node_get_text(); dg_node_set_text(DG_PROP_TEXT) sets its initial/replacement content the same way it already does for DG_NODE_TYPE_LABEL." },
  { name = "TEXT_AREA", id = 6, summary = "ABI 0.2: a multi-line, soft-wrapping editable text area (WidgetKind::kTextArea), 320x160 by default, styled with DG_NODE_TYPE_TEXT_FIELD's own palette. Everything DG_NODE_TYPE_TEXT_FIELD does (click to focus and place the caret, committed text input, DG_EVENT_TEXT_CHANGED, dg_node_get_text(), the clipboard actions) plus: Enter (bare or with Shift) inserts a newline - Ctrl/Alt+Enter still reach the shortcut router; Up/Down keep the caret's column across lines; Home/End go to the visual (wrapped) line's ends, Ctrl+Home/End to the text's; PageUp/PageDown move by the viewport; a press-drag selects; the wheel and the area's own scrollbar (theme tokens color.scrollbar-track/thumb and size.scrollbar) scroll without moving the caret, and the caret is scrolled into view after every edit or move. Tab stays focus traversal. Its composed children (selection highlights, IME underlines, content, caret, scrollbar track and thumb) have no dg_node_t handle. dg_node_set_text(DG_PROP_TEXT) on a text area or text field replaces the EDITOR'S text (caret to the end) and queues no DG_EVENT_TEXT_CHANGED." },
]

[[constant_group]]
name = "value_type"
prefix = "DG_VALUE_"
c_type = "uint32_t"
summary = "dg_value::type."
values = [
  { name = "FLOAT", id = 1, summary = "PropType::k_float." },
  { name = "LENGTH", id = 2, summary = "PropType::k_length." },
  { name = "COLOR", id = 3, summary = "PropType::k_color." },
  { name = "ENUM", id = 4, summary = "PropType::k_enum." },
  { name = "TOKEN", id = 5, summary = "7-6: bits names a token_id (themes/schema.toml). dg_node_set_prop() with this type calls dg::bind_token() instead of a literal write - the ABI's own instance of design.md section 5.7.2's $token live reference, reusing dg_node_set_prop() unchanged rather than adding a second, bind-shaped function." },
  { name = "BOOL", id = 6, summary = "PropType::k_bool - bits is 0 (false) or 1 (true); any other value is DG_ERR_VALUE_OUT_OF_RANGE. First consumer: DG_PROP_DISABLED." },
]

[[constant_group]]
name = "event_kind"
prefix = "DG_EVENT_"
c_type = "uint32_t"
summary = "dg_event::kind."
values = [
  { name = "WINDOW_CLOSED", id = 1, summary = "The window closed (user or dg_debug_ script); the dg_window_t handle is now stale." },
  { name = "CLICK", id = 2, summary = "A press and its release landed on the same node - dg::InteractionChange::clicked." },
  { name = "ACTION", id = 3, summary = "8-3d: a key resolved to a bound intent through design.md section 5.5.2's four-level router (dg::route_key_event()/resolve_action()) - dg_event::action_id names which one, dg_event::node its target (null for an app-level action)." },
  { name = "TEXT_CHANGED", id = 4, summary = "P6 sub-step a2 (second half): a DG_NODE_TYPE_TEXT_FIELD's committed text changed - a real SDL_EVENT_TEXT_INPUT reached it, or an edit key (Backspace/Delete/arrow-with-selection-replace) mutated it. Carries only `window`/`node`, the SAME 'CLICK then ask' shape DG_EVENT_CLICK/dg_node_get_checked() already uses (design.md's own dg_event stays a pure-value POD, per abi/drawgui_abi.lock - no string field could live in it without breaking that): a caller reacting to this queries dg_node_get_text() rather than reading the new text out of the event itself." },
  { name = "WINDOW_RESIZED", id = 5, summary = "ABI 0.2: the window's drawable size changed; x/y carry the new width/height in device pixels. drawgui has already resized and repainted the window by the time this is polled. Not reported for a request that left the size unchanged." },
  { name = "WINDOW_MOVED", id = 6, summary = "ABI 0.2: the window moved; x/y carry the new top-left corner in logical screen coordinates (dg_window_get_position()'s units)." },
  { name = "WINDOW_MINIMIZED", id = 7, summary = "ABI 0.2: the window was minimized." },
  { name = "WINDOW_MAXIMIZED", id = 8, summary = "ABI 0.2: the window was maximized." },
  { name = "WINDOW_RESTORED", id = 9, summary = "ABI 0.2: the window returned to normal from minimized or maximized." },
  { name = "WINDOW_FOCUS_GAINED", id = 10, summary = "ABI 0.2: the window gained keyboard focus. Platforms (including the headless dummy driver) usually report this once right after dg_window_create()." },
  { name = "WINDOW_FOCUS_LOST", id = 11, summary = "ABI 0.2: the window lost keyboard focus." },
  { name = "WINDOW_FULLSCREEN_ENTERED", id = 12, summary = "ABI 0.2: the window became fullscreen." },
  { name = "WINDOW_FULLSCREEN_LEFT", id = 13, summary = "ABI 0.2: the window left fullscreen." },
]

[[constant_group]]
name = "pixel_format"
prefix = "DG_PIXEL_FORMAT_"
c_type = "uint32_t"
summary = "ABI 0.2: the byte order of caller-supplied pixels (dg_window_set_icon())."
values = [
  { name = "BGRA8888", id = 1, summary = "Bytes blue, green, red, alpha - a drawgui-rasterized frame's own order." },
  { name = "RGBA8888", id = 2, summary = "Bytes red, green, blue, alpha - most image decoders' order." },
]

[[constant_group]]
name = "window_state"
prefix = "DG_WINDOW_STATE_"
c_type = "int32_t"
