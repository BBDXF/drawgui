# --- Functions ---------------------------------------------------------------
#
# `impl` is the dg::abi::<impl> C++ function (src/abi/abi_impl.h/.cpp) the
# generated trampoline calls inside its try block. Every trampoline's catch
# clauses are IDENTICAL in shape and differ only in the value they return on
# failure, which tools/gen_abi.py derives from `ret` alone (void -> nothing;
# a pointer type -> nullptr; "int32_t" -> DG_ERR_OOM/DG_ERR_INTERNAL;
# "uint32_t" -> 0) - see tools/gen_abi.py's RETURN_CLASSES for the
# classification - classifying by `ret` rather than adding a per-function
# on_error field is the stronger uniformity guarantee: there is no field
# to leave blank.

[[function]]
name = "dg_abi_version"
ret = "uint32_t"
impl = "abi_version"
params = []
summary = "MAJOR<<16 | MINOR - design.md section 5.8's own dg_abi_version() line."

[[function]]
name = "dg_app_create"
ret = "dg_app_t*"
impl = "app_create"
params = [{ name = "opts", type = "const dg_app_opts*" }]
summary = "Starts the window manager. `opts` may be null (defaults)."

[[function]]
name = "dg_app_destroy"
ret = "void"
impl = "app_destroy"
params = [{ name = "app", type = "dg_app_t*" }]
summary = "Closes every open window and shuts the platform down. `app` is stale afterwards."

[[function]]
name = "dg_app_add_font"
ret = "int32_t"
impl = "app_add_font"
params = [{ name = "app", type = "dg_app_t*" }, { name = "directory", type = "const char*" }, { name = "family", type = "const char*" }]
summary = "P6 sub-step a1: the ABI's only font-assembly entry point (design.md's dg::FontCatalog, include/drawgui/render/font_catalog.h). Must be called before dg_window_create() for EVERY window that should draw text - a dg::TreeSpec's `fonts` catalog is a construction-time argument RenderTree has no setter for afterwards (render_tree.h's own comment on why), so each window captures a copy of this app's catalog exactly as it stands at that window's OWN dg_window_create() call; a font added afterwards reaches only windows created after it, never one already open. `directory` is scanned once, on this app's FIRST call; every later call's `directory` argument is ignored (the same catalog is reused, matching FontCatalog::add()'s own 'one scan, many add()s' shape - examples/05_widgets's own font setup). `family` FAILS (DG_ERR_INVALID_ARGUMENT, dg_last_error() names the families this machine actually has) when this machine has no such family - never a silent substitution (FontCatalog::add()'s own contract). The FIRST family ever added successfully, on any app, becomes DG_NODE_TYPE_LABEL's engine-chosen default font."

[[function]]
name = "dg_window_create"
ret = "dg_window_t*"
impl = "window_create"
params = [{ name = "app", type = "dg_app_t*" }, { name = "opts", type = "const dg_window_opts*" }]
summary = "Opens one window immediately, filled with opts->background_argb until the first frame paints."

[[function]]
name = "dg_window_set_root"
ret = "int32_t"
impl = "window_set_root"
params = [{ name = "window", type = "dg_window_t*" }, { name = "node", type = "dg_node_t*" }]
summary = "Attaches `node` (must be pending) under window's tree as its sole content root."

[[function]]
name = "dg_node_create"
ret = "dg_node_t*"
impl = "node_create"
params = [{ name = "app", type = "dg_app_t*" }, { name = "type_id", type = "uint16_t" }]
summary = "Allocates a PENDING node - not yet part of any window's tree. See DG_NODE_TYPE_*."

[[function]]
name = "dg_node_set_prop"
ret = "int32_t"
impl = "node_set_prop"
params = [{ name = "node", type = "dg_node_t*" }, { name = "prop_id", type = "uint16_t" }, { name = "value", type = "const dg_value*" }]
summary = "dg::set_prop() at the ABI boundary. Works on pending or live nodes."

[[function]]
name = "dg_node_set_text"
ret = "int32_t"
impl = "node_set_text"
params = [{ name = "node", type = "dg_node_t*" }, { name = "prop_id", type = "uint16_t" }, { name = "utf8", type = "const char*" }, { name = "len", type = "uint32_t" }]
summary = "P6 sub-step a1: dg::set_text() at the ABI boundary - the dedicated-setter channel's fifth client (design.md section 5.9.5), for the same reason dg_node_set_gradient/_shadow/_image would be: a UTF-8 string cannot ride dg_value's fixed-size {float, uint32} union. `prop_id` must be DG_PROP_TEXT, or (ABI 0.2) DG_PROP_PLACEHOLDER on a DG_NODE_TYPE_TEXT_FIELD/TEXT_AREA - the muted hint shown while the editor is empty and not composing (DG_ERR_NOT_APPLICABLE on any other node); any other id is DG_ERR_TYPE_MISMATCH/DG_ERR_UNKNOWN_ID, the same validation dg_node_set_prop() runs. `utf8`/`len` are copied immediately - not retained past the call. Requires a LIVE node (DG_ERR_NO_WINDOW otherwise), matching dg_node_set_prop()."

[[function]]
name = "dg_node_get_checked"
ret = "int32_t"
impl = "node_get_checked"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "P6 sub-step a2: dg::WidgetSet::is_checked() at the ABI boundary, for a LIVE DG_NODE_TYPE_CHECKBOX node - the query half of the same 'CLICK then ask' shape dg_node_scope_action()/DG_EVENT_ACTION already uses, chosen over a new DG_EVENT_TOGGLE because the checked bit's one true source is WidgetSet and an event field would only be a second, driftable copy of it. Returns 1 (checked) or 0 (unchecked) on success - both non-negative, matching dg_wait_events()/dg_poll_events()'s own 'non-negative is data, negative is DG_ERR_*' convention, since 0 is not this ABI's success code on an int32_t-returning function that reports data rather than only a status. DG_ERR_INVALID_HANDLE for a stale/unknown node, DG_ERR_NO_WINDOW for a still-pending one (matching dg_node_set_prop()'s own requirement), DG_ERR_UNSUPPORTED for a live node whose type_id is not DG_NODE_TYPE_CHECKBOX. ABI 0.2: a DG_NODE_TYPE_RADIO answers too (1 = selected)."

[[function]]
name = "dg_node_get_text"
ret = "int32_t"
impl = "node_get_text"
params = [{ name = "node", type = "dg_node_t*" }, { name = "buf", type = "char*" }, { name = "cap", type = "uint32_t" }, { name = "out_len", type = "uint32_t*" }]
summary = "P6 sub-step a2 (second half): dg::WidgetSet::text_field_text() at the ABI boundary, for a LIVE DG_NODE_TYPE_TEXT_FIELD node - the two-trip shape (ask the length, allocate, ask again) rather than a thread-local buffer (dg_last_error()/dg_shortcut_label()'s own shape): unlike those two, a caller may reasonably want to hold more than one field's text at once (a TodoMVC re-rendering every row's own input), which a single shared buffer cannot serve without one field's read stomping another's before the caller finishes copying it out. `out_len` (may be null if the caller does not want it) always receives the field's FULL byte length, regardless of `cap` - a caller passes cap=0 first to size its own allocation, then calls again with a real buffer. `buf` receives at most `cap` bytes (truncated at a byte boundary, NOT a grapheme boundary, if `cap` is smaller than the full text - a caller sizing its buffer from the first call's `out_len` never truncates) and is UNTOUCHED when cap==0. Returns DG_ERR_OK on success (0 IS this ABI's success code here - the data returned lives in `buf`/`out_len`, not in the return value itself, unlike dg_node_get_checked()). DG_ERR_INVALID_HANDLE for a stale/unknown node, DG_ERR_NO_WINDOW for a still-pending one, DG_ERR_UNSUPPORTED for a live node whose type_id is not DG_NODE_TYPE_TEXT_FIELD, DG_ERR_INVALID_ARGUMENT if cap > 0 but buf is null."

[[function]]
name = "dg_node_insert_before"
ret = "int32_t"
impl = "node_insert_before"
params = [{ name = "parent", type = "dg_node_t*" }, { name = "child", type = "dg_node_t*" }, { name = "ref", type = "dg_node_t*" }]
summary = "Inserts `child` under live `parent`, immediately before `ref` (appended when `ref` is null). `ref`, when given, must be a live DIRECT child of `parent` and not `child` itself, else DG_ERR_INVALID_ARGUMENT (DG_ERR_INVALID_HANDLE if `ref` is stale). A PENDING `child` becomes live. A child already LIVE in the same window is MOVED (detached and reinserted at the new position, keeping its identity, widget state and handle) - this is how a keyed reconciler reorders. Moving a node under itself or its own descendant is a cycle and DG_ERR_INVALID_ARGUMENT; a child live in a DIFFERENT window is DG_ERR_ALREADY_ATTACHED."

[[function]]
name = "dg_node_remove"
ret = "int32_t"
impl = "node_remove"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "Removes `node`. A LIVE node is detached from its window's tree together with its whole subtree: every node in the subtree has its widget/theme/focus/animation/action/interaction state cleaned up (dg::remove_subtree), the vacated area is repainted and the former parent relaid out, and the handle of `node` AND of every descendant that has one become invalid (DG_ERR_INVALID_HANDLE on every later call). Removing a window's root node clears that window's root, so dg_window_set_root() may attach a new one. A PENDING node only has its handle invalidated."

[[function]]
name = "dg_node_scope_action"
ret = "int32_t"
impl = "node_scope_action"
params = [{ name = "node", type = "dg_node_t*" }, { name = "action_id", type = "uint16_t" }]
summary = "8-3d: declares that `node` consumes `action_id` (design.md section 5.5.3) - wraps dg::ActionScopes::scope() unchanged. `node` must be LIVE (DG_ERR_NO_WINDOW otherwise): ActionScopes is keyed by dg::NodeId, which a pending node does not have yet. A no-op, not an error, if `node` already scopes `action_id`."

[[function]]
name = "dg_shortcut_label"
ret = "const char*"
impl = "shortcut_label"
params = [{ name = "action_id", type = "uint16_t" }]
summary = "8-3d: the platform accelerator text for `action_id` (e.g. \"Ctrl+A\"), generated from the SAME binding table dg::shortcut_label() (chord.h, unit-tested since 8-1/8-2) already builds - this wraps it rather than re-implementing label generation. Returns NULL for an action_id no binding names (dg::shortcut_label()'s own std::optional empty case) rather than an empty string. Valid until the next dg_shortcut_label() call on this thread, matching dg_last_error()'s own lifetime rule."

[[function]]
name = "dg_wait_events"
ret = "int32_t"
impl = "wait_events"
params = [{ name = "app", type = "dg_app_t*" }, { name = "timeout_ms", type = "int32_t" }]
summary = "Blocks up to timeout_ms (negative: forever), pumps every window, returns the number of events now pollable."

[[function]]
name = "dg_poll_events"
ret = "int32_t"
impl = "poll_events"
params = [{ name = "app", type = "dg_app_t*" }, { name = "out", type = "dg_event*" }, { name = "max", type = "int32_t" }]
summary = "Dequeues up to max events into out[]. Never blocks. Returns the number copied."

[[function]]
name = "dg_last_error"
ret = "const char*"
impl = "last_error"
params = []
summary = "The message from the most recent failing call on this thread. Valid until the next drawgui call on it."

[[function]]
name = "dg_dump_layout_tree"
ret = "const char*"
impl = "dump_layout_tree"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "This node's subtree as JSON (type/bounds/parentData)."

[[function]]
name = "dg_theme_load_dir"
ret = "dg_theme_t*"
impl = "theme_load_dir"
params = [{ name = "app", type = "dg_app_t*" }, { name = "dir", type = "const char*" }, { name = "err", type = "dg_theme_err*" }]
summary = "7-6: loads an EXTERNAL, untrusted theme package directory (design.md section 5.7.4/5.7.5 via dg::ThemePackage) - path traversal/size/resource-count bounds all apply. `err` may be null; on failure it (if non-null) and dg_last_error() both describe why."

[[function]]
name = "dg_theme_load_memory"
ret = "dg_theme_t*"
impl = "theme_load_memory"
params = [{ name = "app", type = "dg_app_t*" }, { name = "json", type = "const char*" }, { name = "len", type = "uint32_t" }, { name = "base_dir", type = "const char*" }, { name = "err", type = "dg_theme_err*" }]
summary = "7-6: loads a theme from an in-memory JSON blob the host already has. `base_dir`, if non-null, is opened as a dg::ThemePackage resource root (the same path-traversal surface dg_theme_load_dir() has) so resource reads still resolve safely; null means no resource access for this theme."

[[function]]
name = "dg_theme_set_variant"
ret = "int32_t"
impl = "theme_set_variant"
params = [{ name = "theme", type = "dg_theme_t*" }, { name = "variant", type = "const char*" }]
summary = "7-6: \"light\" or \"dark\" (design.md section 5.7.2). If this theme is its app's currently active one, every window's bound nodes re-resolve immediately - no widget tree rebuild (design.md section 5.7.6)."

[[function]]
name = "dg_theme_override"
ret = "int32_t"
impl = "theme_override"
params = [{ name = "theme", type = "dg_theme_t*" }, { name = "token_id", type = "uint16_t" }, { name = "value", type = "const dg_value*" }]
summary = "7-6: patches one token's value in-place (the token's own scalar type is always DG_VALUE_COLOR or DG_VALUE_FLOAT/DG_VALUE_LENGTH - never a dedicated-setter shape, since every theme token is scalar by design.md section 5.7.2's own two-way dichotomy). A color token is overridden under the theme's CURRENTLY ACTIVE variant. Live-updates bound nodes exactly like dg_theme_set_variant()."

[[function]]
name = "dg_app_set_theme"
ret = "int32_t"
impl = "app_set_theme"
params = [{ name = "app", type = "dg_app_t*" }, { name = "theme", type = "dg_theme_t*" }]
summary = "7-6: makes `theme` this app's active theme and immediately re-applies every window's ThemeBindings against it - this IS hot reload's second half: reload with dg_theme_load_dir()/load_memory() again, then call this again with the fresh handle (design.md section 5.7.6)."

[[function]]
name = "dg_debug_warp_pointer"
ret = "int32_t"
impl = "debug_warp_pointer"
params = [{ name = "window", type = "dg_window_t*" }, { name = "x", type = "int32_t" }, { name = "y", type = "int32_t" }]
summary = "TEST-ONLY. WindowManager::warp_pointer() at the ABI boundary - see the file header."

[[function]]
name = "dg_debug_post_pointer_button"
ret = "int32_t"
impl = "debug_post_pointer_button"
params = [{ name = "window", type = "dg_window_t*" }, { name = "down", type = "int32_t" }, { name = "x", type = "int32_t" }, { name = "y", type = "int32_t" }]
summary = "TEST-ONLY. WindowManager::post_pointer_button() at the ABI boundary - see the file header."

[[function]]
name = "dg_debug_post_key"
ret = "int32_t"
impl = "debug_post_key"
params = [{ name = "window", type = "dg_window_t*" }, { name = "down", type = "int32_t" }, { name = "logical_key_name", type = "const char*" }]
summary = "TEST-ONLY. WindowManager::post_logical_key() at the ABI boundary, driving a real SDL key event through the real queue exactly as dg_debug_post_pointer_button() does for clicks - see the file header. `logical_key_name` is a chord over a key name from src/shortcuts/logical_key_table.generated.inc, parsed with dg::parse_chord() - a bare key (\"PageUp\") or, since ABI 0.2, one carrying modifiers (\"Mod+Z\", \"Mod+Shift+Z\"; the injected event carries Ctrl/Shift/Alt accordingly, so it can drive a focused text editor's undo/redo). A malformed chord or a key the generated table does not list is DG_ERR_INVALID_ARGUMENT."

[[function]]
name = "dg_debug_trigger_exception"
ret = "int32_t"
impl = "debug_trigger_exception"
params = [{ name = "kind", type = "int32_t" }]
summary = "TEST-ONLY. Unconditionally throws (1=bad_alloc, 2=runtime_error, else an int) - the exception-boundary test's own fault injector."

[[function]]
name = "dg_debug_capture_png"
ret = "const char*"
impl = "debug_capture_png"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "TEST-ONLY. P6 sub-step a1's golden-image oracle: encodes this window's CURRENT RasterSurface (whatever dg_wait_events()/dg_poll_events()'s internal pump most recently painted - call one of them at least once first) as PNG into a thread-local buffer and returns a pointer to its first byte. BINARY, not C-string-safe - a PNG may contain an embedded NUL - so a caller must pair this with dg_debug_capture_png_len() rather than strlen(). Returns NULL (and dg_last_error() names why) if the window has never painted a frame, or if PNG encoding failed. Valid until the next dg_debug_capture_png() call on this thread, matching dg_last_error()'s own lifetime rule."

[[function]]
name = "dg_debug_capture_png_len"
ret = "uint32_t"
impl = "debug_capture_png_len"
params = []
summary = "TEST-ONLY. The byte length of the buffer dg_debug_capture_png() most recently returned on this thread. 0 before the first call, or after one that returned NULL."

[[function]]
name = "dg_debug_post_text_input"
ret = "int32_t"
impl = "debug_post_text_input"
params = [{ name = "window", type = "dg_window_t*" }, { name = "utf8", type = "const char*" }]
summary = "TEST-ONLY. WindowManager::post_text_input() at the ABI boundary, driving a real SDL_EVENT_TEXT_INPUT through the real queue exactly as dg_debug_post_pointer_button()/dg_debug_post_key() do for a click/key press - see the file header. Exists ONLY because there is no other headless way to reach DG_NODE_TYPE_TEXT_FIELD's committed-text path (real IME/keyboard text composition needs an actual display): a caller-under-test still has to click the field first (a real dg_debug_post_pointer_button() press+release, which is what actually focuses it and calls WindowManager::start_text_input()) before this has anywhere to deliver text TO - posting text_input at an unfocused window is a silent no-op, matching handle_text()'s own 'no focused node, nothing happens' rule."

[[function]]
name = "dg_debug_post_text_field_key"
ret = "int32_t"
impl = "debug_post_text_field_key"
params = [{ name = "window", type = "dg_window_t*" }, { name = "down", type = "int32_t" }, { name = "key_name", type = "const char*" }, { name = "shift", type = "int32_t" }]
summary = "TEST-ONLY. WindowManager::post_key() at the ABI boundary, driving a real SDL key event through the real queue for one of the text-editing keys process_key_event() dispatches directly to a focused editor: Left/Right/Home/End/Backspace/Delete, and (ABI 0.2, meaningful for DG_NODE_TYPE_TEXT_AREA) Up/Down/Enter/PageUp/PageDown, and Tab (focus traversal; `shift` makes it Shift+Tab), and (phase B) Escape (dismisses a menu, cancels a dialog) - `key_name` is exactly one of these bare names, case-sensitive, DG_ERR_INVALID_ARGUMENT for any other string. No other modifier than Shift can be posted (so no Ctrl+Home). This is a SEPARATE debug hook from dg_debug_post_key() rather than a second parameter on it: dg_debug_post_key() parses `logical_key_name` with dg::parse_chord() against input/shortcuts.toml's own generated binding-name table, and none of these six keys is a shortcut binding name at all (see this file's own DG_NODE_TYPE_TEXT_FIELD entry) - there is no chord for parse_chord() to parse. `shift` (nonzero extends a text field's selection, matching handle_text_field_key()'s own dg::Modifier::kShift check) is meaningless for Backspace/Delete, which ignore it exactly like dg::WidgetSet::text_field_backspace()/text_field_delete_forward() do."

[[function]]
name = "dg_window_set_title"
ret = "int32_t"
impl = "window_set_title"
params = [{ name = "window", type = "dg_window_t*" }, { name = "utf8", type = "const char*" }]
summary = "ABI 0.2: replaces the window's title (UTF-8, copied). DG_ERR_INVALID_ARGUMENT if `utf8` is null. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_get_title"
ret = "int32_t"
impl = "window_get_title"
params = [{ name = "window", type = "dg_window_t*" }, { name = "buf", type = "char*" }, { name = "cap", type = "uint32_t" }, { name = "out_len", type = "uint32_t*" }]
summary = "ABI 0.2: the window's current title, with dg_node_get_text()'s two-trip shape: `out_len` (may be null) receives the full byte length, `buf` at most `cap` bytes, no NUL terminator. DG_ERR_INVALID_ARGUMENT if cap > 0 but buf is null. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_set_size"
ret = "int32_t"
impl = "window_set_size"
params = [{ name = "window", type = "dg_window_t*" }, { name = "width", type = "int32_t" }, { name = "height", type = "int32_t" }]
summary = "ABI 0.2: requests a new size in logical units (dg_window_opts::width/height's units), clamped by any min/max size. Both must be positive (DG_ERR_INVALID_ARGUMENT). Asynchronous on some platforms: DG_EVENT_WINDOW_RESIZED confirms the result. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_get_size"
ret = "int32_t"
impl = "window_get_size"
params = [{ name = "window", type = "dg_window_t*" }, { name = "width", type = "int32_t*" }, { name = "height", type = "int32_t*" }]
summary = "ABI 0.2: the window's current size in logical units. Either out-param may be null. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_set_position"
ret = "int32_t"
impl = "window_set_position"
params = [{ name = "window", type = "dg_window_t*" }, { name = "x", type = "int32_t" }, { name = "y", type = "int32_t" }]
summary = "ABI 0.2: requests a new top-left corner, logical screen coordinates. Some window systems (Wayland) ignore it. DG_EVENT_WINDOW_MOVED confirms the result. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_get_position"
ret = "int32_t"
impl = "window_get_position"
params = [{ name = "window", type = "dg_window_t*" }, { name = "x", type = "int32_t*" }, { name = "y", type = "int32_t*" }]
summary = "ABI 0.2: the window's top-left corner as the platform reports it (often 0,0 where the window system hides it). Either out-param may be null. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_minimize"
ret = "int32_t"
impl = "window_minimize"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2: requests minimizing; DG_EVENT_WINDOW_MINIMIZED confirms it. The headless dummy driver refuses (DG_ERR_UNSUPPORTED). DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_maximize"
ret = "int32_t"
impl = "window_maximize"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2: requests maximizing; DG_EVENT_WINDOW_MAXIMIZED confirms it. The headless dummy driver refuses (DG_ERR_UNSUPPORTED). DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_restore"
ret = "int32_t"
impl = "window_restore"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2: requests a return to normal from minimized/maximized; DG_EVENT_WINDOW_RESTORED confirms it. The headless dummy driver refuses (DG_ERR_UNSUPPORTED). DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_set_fullscreen"
ret = "int32_t"
impl = "window_set_fullscreen"
params = [{ name = "window", type = "dg_window_t*" }, { name = "fullscreen", type = "int32_t" }]
summary = "ABI 0.2: nonzero enters fullscreen, 0 leaves it; DG_EVENT_WINDOW_FULLSCREEN_ENTERED/LEFT (and usually DG_EVENT_WINDOW_RESIZED) confirm it. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_set_resizable"
ret = "int32_t"
impl = "window_set_resizable"
params = [{ name = "window", type = "dg_window_t*" }, { name = "resizable", type = "int32_t" }]
summary = "ABI 0.2: nonzero lets the user resize the window. DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_set_min_size"
ret = "int32_t"
impl = "window_set_min_size"
params = [{ name = "window", type = "dg_window_t*" }, { name = "width", type = "int32_t" }, { name = "height", type = "int32_t" }]
summary = "ABI 0.2: minimum size in logical units; 0 on an axis removes that limit. Negative values or a minimum above the current maximum are refused (DG_ERR_UNSUPPORTED). DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_set_max_size"
ret = "int32_t"
impl = "window_set_max_size"
params = [{ name = "window", type = "dg_window_t*" }, { name = "width", type = "int32_t" }, { name = "height", type = "int32_t" }]
summary = "ABI 0.2: maximum size in logical units; 0 on an axis removes that limit. Negative values or a maximum below the current minimum are refused (DG_ERR_UNSUPPORTED). DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_set_icon"
ret = "int32_t"
impl = "window_set_icon"
params = [{ name = "window", type = "dg_window_t*" }, { name = "pixels", type = "const void*" }, { name = "width", type = "int32_t" }, { name = "height", type = "int32_t" }, { name = "row_bytes", type = "uint32_t" }, { name = "format", type = "uint32_t" }]
summary = "ABI 0.2: sets the window icon from 32-bit pixels with straight alpha, copied before returning. `format` is DG_PIXEL_FORMAT_*. DG_ERR_INVALID_ARGUMENT for null pixels, a non-positive size, row_bytes < width*4 or an unknown format. The headless dummy driver has no icons and refuses a valid image (DG_ERR_UNSUPPORTED). DG_ERR_INVALID_HANDLE for a closed/unknown window. A request the platform refuses is DG_ERR_UNSUPPORTED, with the platform's reason in dg_last_error()."

[[function]]
name = "dg_window_get_state"
ret = "int32_t"
impl = "window_get_state"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2: the window's state as a non-negative bitmask of DG_WINDOW_STATE_* (the same 'non-negative is data, negative is DG_ERR_*' convention as dg_node_get_checked()). DG_ERR_INVALID_HANDLE for a closed/unknown window."

[[function]]
name = "dg_debug_get_cursor"
ret = "int32_t"
impl = "debug_get_cursor"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "TEST-ONLY. ABI 0.2: the window's current cursor as a DG_CURSOR_* value (never DG_CURSOR_AUTO), or a negative DG_ERR_* - WindowManager::current_cursor() at the ABI boundary. The cursor itself follows the pointer automatically inside dg_wait_events()/dg_poll_events() (DG_PROP_CURSOR); this only observes the result, which a headless run cannot see on screen."


[[function]]
name = "dg_node_focus"
ret = "int32_t"
impl = "node_focus"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "ABI 0.2: gives keyboard focus to a LIVE node, exactly as a click on it would (an editor shows its caret and starts taking text input). Queues DG_EVENT_FOCUS_CHANGED when focus actually moved. DG_ERR_UNSUPPORTED for a node that cannot take focus (focusable types: BUTTON, CHECKBOX, RADIO, SLIDER, TEXT_FIELD, TEXT_AREA, DROPDOWN, TABS, TREE, TABLE, LIST) or is disabled; DG_ERR_NO_WINDOW for a pending node; DG_ERR_INVALID_HANDLE for a stale one."

[[function]]
name = "dg_window_get_focus"
ret = "dg_node_t*"
impl = "window_get_focus"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2: the node that has keyboard focus in `window`, or null when nothing has (or the window is invalid - dg_last_error() then says so)."

[[function]]
name = "dg_window_clear_focus"
ret = "int32_t"
impl = "window_clear_focus"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2: blurs whatever has focus in `window` (DG_EVENT_FOCUS_CHANGED with a null node, if something had it). DG_ERR_INVALID_HANDLE for a closed/unknown window."

[[function]]
name = "dg_node_get_scroll_offset"
ret = "int32_t"
impl = "node_get_scroll_offset"
params = [{ name = "node", type = "dg_node_t*" }, { name = "x", type = "int32_t*" }, { name = "y", type = "int32_t*" }]
summary = "ABI 0.2: how far a LIVE DG_NODE_TYPE_SCROLL_VIEW, DG_NODE_TYPE_LIST or DG_NODE_TYPE_TEXT_AREA is scrolled, in device pixels (0,0 = at the start). Either out-param may be null. DG_ERR_UNSUPPORTED for any other node type."

[[function]]
name = "dg_list_set_items"
ret = "int32_t"
impl = "list_set_items"
params = [{ name = "node", type = "dg_node_t*" }, { name = "items", type = "const char* const*" }, { name = "count", type = "uint32_t" }, { name = "item_height", type = "int32_t" }]
summary = "ABI 0.2: replaces a LIVE DG_NODE_TYPE_LIST's rows with `count` NUL-terminated UTF-8 strings, copied before returning (`items` may be null when count is 0; a null entry is an empty row). `item_height` is every row's height in device pixels; 0 keeps the current height (28 by default). The scroll offset is clamped to the new content and the selection cleared. DG_ERR_INVALID_ARGUMENT for a null array with count > 0, a negative item_height, or count above 2^24; DG_ERR_UNSUPPORTED for a node that is not a list."

[[function]]
name = "dg_list_get_selected"
ret = "int32_t"
impl = "list_get_selected"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "ABI 0.2: the selected row index of a LIVE DG_NODE_TYPE_LIST (non-negative), -1 when nothing is selected - or a negative DG_ERR_* below -1 (DG_ERR_INVALID_HANDLE, DG_ERR_NO_WINDOW, DG_ERR_UNSUPPORTED). Note DG_ERR_OOM is -1 too, but this function allocates nothing."

[[function]]
name = "dg_list_set_selected"
ret = "int32_t"
impl = "list_set_selected"
params = [{ name = "node", type = "dg_node_t*" }, { name = "index", type = "int32_t" }]
summary = "ABI 0.2: selects row `index` of a LIVE DG_NODE_TYPE_LIST (-1 clears the selection). Does not scroll and queues no event. DG_ERR_VALUE_OUT_OF_RANGE for an index outside -1..count-1."

[[function]]
name = "dg_node_set_image_data"
ret = "int32_t"
impl = "node_set_image_data"
params = [{ name = "node", type = "dg_node_t*" }, { name = "bytes", type = "const void*" }, { name = "len", type = "uint32_t" }, { name = "svg_tint_argb", type = "uint32_t" }]
summary = "ABI 0.2: decodes a complete PNG, JPEG, WebP or SVG file's bytes (sniffed - SVG is anything starting with '<'; copied, not retained) and shows it in a LIVE DG_NODE_TYPE_IMAGE or DG_NODE_TYPE_BOX, keeping its DG_PROP_IMAGE_FIT. `svg_tint_argb`, when its alpha is nonzero, recolours an SVG to that colour keeping the icon's shape (ignored for bitmaps); 0 means no tint. These bytes are TRUSTED application assets: SVG goes through Skia's SVG parser. Decoded images live as long as the app. DG_ERR_INVALID_ARGUMENT for null/empty bytes or data that does not decode (dg_last_error() says why); DG_ERR_UNSUPPORTED for another node type."

[[function]]
name = "dg_node_set_image_file"
ret = "int32_t"
impl = "node_set_image_file"
params = [{ name = "node", type = "dg_node_t*" }, { name = "path", type = "const char*" }, { name = "svg_tint_argb", type = "uint32_t" }]
summary = "ABI 0.2: dg_node_set_image_data() with the bytes read from `path`. DG_ERR_INVALID_ARGUMENT for a null path, an unreadable file or one that does not decode."

[[function]]
name = "dg_timer_add"
ret = "uint32_t"
impl = "timer_add"
params = [{ name = "app", type = "dg_app_t*" }, { name = "delay_ms", type = "int32_t" }, { name = "repeat", type = "int32_t" }]
summary = "ABI 0.2: schedules DG_EVENT_TIMER `delay_ms` (negative counts as 0) from now; nonzero `repeat` fires it again every delay_ms (at least 1) until dg_timer_cancel(). Returns the timer id (never 0, never reused within the app, below 2^31), or 0 on failure. dg_wait_events() wakes for the nearest timer, so a host blocking with timeout -1 still gets it. Main thread only."

[[function]]
name = "dg_timer_cancel"
ret = "int32_t"
impl = "timer_cancel"
params = [{ name = "app", type = "dg_app_t*" }, { name = "timer_id", type = "uint32_t" }]
summary = "ABI 0.2: stops a timer; it never fires again. DG_ERR_OK when it was pending; DG_ERR_INVALID_ARGUMENT for an id that already fired (one-shot), was cancelled or was never issued - so cancelling twice is harmless. Main thread only."

[[function]]
name = "dg_wake"
ret = "int32_t"
impl = "wake"
params = [{ name = "app", type = "dg_app_t*" }]
summary = "ABI 0.2: makes a dg_wait_events() blocked on the main thread return now, without queuing any event. THREAD-SAFE: may be called from any thread while `app` is alive (not concurrently with dg_app_create()/dg_app_destroy()). DG_ERR_UNSUPPORTED if the platform event queue is full."

[[function]]
name = "dg_post_user_event"
ret = "int32_t"
impl = "post_user_event"
params = [{ name = "app", type = "dg_app_t*" }, { name = "payload", type = "uint64_t" }]
summary = "ABI 0.2: queues DG_EVENT_USER carrying `payload` and wakes dg_wait_events(). THREAD-SAFE like dg_wake(); events from one thread arrive in posting order. DG_ERR_UNSUPPORTED if the platform event queue is full."

[[function]]
name = "dg_debug_post_wheel"
ret = "int32_t"
impl = "debug_post_wheel"
params = [{ name = "window", type = "dg_window_t*" }, { name = "dx", type = "float" }, { name = "dy", type = "float" }]
summary = "TEST-ONLY. ABI 0.2: WindowManager::post_wheel() at the ABI boundary - a real wheel event, in notches (negative dy scrolls down), at the last dg_debug_warp_pointer() position."

[[function]]
name = "dg_debug_post_pointer_button_ex"
ret = "int32_t"
impl = "debug_post_pointer_button_ex"
params = [{ name = "window", type = "dg_window_t*" }, { name = "down", type = "int32_t" }, { name = "x", type = "int32_t" }, { name = "y", type = "int32_t" }, { name = "button", type = "int32_t" }, { name = "clicks", type = "int32_t" }]
summary = "TEST-ONLY. ABI 0.2: dg_debug_post_pointer_button() with a DG_POINTER_BUTTON_* `button` and the platform click count `clicks` the event carries (0 = let drawgui count). DG_ERR_INVALID_ARGUMENT for an unknown button or negative clicks."

[[function]]
name = "dg_menu_open"
ret = "int32_t"
impl = "menu_open"
params = [{ name = "window", type = "dg_window_t*" }, { name = "anchor", type = "dg_node_t*" }, { name = "x", type = "int32_t" }, { name = "y", type = "int32_t" }, { name = "labels", type = "const char* const*" }, { name = "flags", type = "const uint32_t*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2 phase B: opens a popup menu (dg::Menu) over `window` - below the live node `anchor` (min width = its width), or, when `anchor` is null, at the point x/y (device pixels, e.g. a DG_EVENT_CONTEXT_CLICK's position). `labels`/`flags` are `count` parallel entries (copied; `flags` may be null = all 0; a null label is empty): DG_MENU_ITEM_*. Returns the menu id (positive) or a negative DG_ERR_*. While it is open the pump routes every pointer/key/text event of the window to it first (Up/Down/Home/End move, Enter or a click activates, Escape or a click outside dismisses, typing a letter jumps); it closes itself and queues DG_EVENT_MENU_ACTIVATE or DG_EVENT_MENU_DISMISS. One menu per window: opening another dismisses the first (DG_EVENT_MENU_DISMISS for it). DG_ERR_INVALID_ARGUMENT for count 0, a null `labels`, count above 4096 or a menu with no selectable item; DG_ERR_UNSUPPORTED while a dialog is open on the window."

[[function]]
name = "dg_menu_close"
ret = "int32_t"
impl = "menu_close"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2 phase B: closes the window's open dg_menu_open() menu without queuing an event (DG_ERR_OK even when none is open). Focus returns where it was."

[[function]]
name = "dg_dropdown_set_items"
ret = "int32_t"
impl = "dropdown_set_items"
params = [{ name = "node", type = "dg_node_t*" }, { name = "items", type = "const char* const*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2 phase B: replaces a LIVE DG_NODE_TYPE_DROPDOWN's options with `count` UTF-8 strings (copied; a null entry is empty) and clears the selection (the placeholder shows). Closes its menu if open. DG_ERR_INVALID_ARGUMENT for a null array with count > 0 or count above 4096; DG_ERR_UNSUPPORTED for another node type."

[[function]]
name = "dg_dropdown_get_selected"
ret = "int32_t"
impl = "dropdown_get_selected"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "ABI 0.2 phase B: the selected option index of a LIVE DG_NODE_TYPE_DROPDOWN, -1 when none, or a DG_ERR_* below -1."

[[function]]
name = "dg_dropdown_set_selected"
ret = "int32_t"
impl = "dropdown_set_selected"
params = [{ name = "node", type = "dg_node_t*" }, { name = "index", type = "int32_t" }]
summary = "ABI 0.2 phase B: selects option `index` (-1 clears it, showing the placeholder). Queues no event. DG_ERR_VALUE_OUT_OF_RANGE outside -1..count-1."

[[function]]
name = "dg_node_set_tooltip"
ret = "int32_t"
impl = "node_set_tooltip"
params = [{ name = "node", type = "dg_node_t*" }, { name = "utf8", type = "const char*" }]
summary = "ABI 0.2 phase B: gives a LIVE node a tooltip (dg::Tooltip; copied). Hovering the node - or any descendant without a tooltip of its own - for the tooltip delay shows a small popup below it; moving off, pressing, scrolling or leaving the window hides it. dg_wait_events() wakes for the delay by itself. Null or empty removes the tooltip. Removing the node removes its tooltip."

[[function]]
name = "dg_node_set_user_data"
ret = "int32_t"
impl = "node_set_user_data"
params = [{ name = "node", type = "dg_node_t*" }, { name = "value", type = "uint64_t" }]
summary = "ABI 0.2: stores an opaque 64-bit value on a node (an index or a pointer cast to an integer) for the caller's own bookkeeping; drawgui never reads or dereferences it, and events do not carry it. Works on a pending node too (kept when it is attached). 0 until set; gone with the node. DG_ERR_INVALID_HANDLE for a removed or invalid handle."

[[function]]
name = "dg_node_get_user_data"
ret = "int32_t"
impl = "node_get_user_data"
params = [{ name = "node", type = "dg_node_t*" }, { name = "out_value", type = "uint64_t*" }]
summary = "ABI 0.2: writes the value dg_node_set_user_data() stored (0 if never set) to `out_value`. Pending or live. DG_ERR_INVALID_ARGUMENT for a null `out_value`; DG_ERR_INVALID_HANDLE for a removed or invalid handle."

[[function]]
name = "dg_app_set_tooltip_delay"
ret = "int32_t"
impl = "app_set_tooltip_delay"
params = [{ name = "app", type = "dg_app_t*" }, { name = "delay_ms", type = "int32_t" }]
summary = "ABI 0.2 phase B: the hover delay before any tooltip of this app shows, 0..60000 ms (default 500). Applies to every window, including ones already open. DG_ERR_VALUE_OUT_OF_RANGE outside that range."

[[function]]
name = "dg_dialog_open"
ret = "int32_t"
impl = "dialog_open"
params = [{ name = "window", type = "dg_window_t*" }, { name = "title", type = "const char*" }, { name = "body", type = "const char*" }, { name = "buttons", type = "const char* const*" }, { name = "count", type = "uint32_t" }, { name = "default_button", type = "int32_t" }, { name = "cancel_button", type = "int32_t" }]
summary = "ABI 0.2 phase B: opens a modal dialog (dg::Dialog) over the whole window: a scrim, a panel with `title`, the wrapped `body` (may be null) and `count` buttons (copied; count 0 means one \"OK\" button). `default_button` gets initial focus and answers Enter (-1 = none), `cancel_button` answers Escape (-1 = Escape reports -1). Returns the dialog id (positive) or a negative DG_ERR_*. While it is open every pointer/key event of the window goes to it (Tab cycles its buttons, nothing behind it reacts); any open menu is dismissed first. Closing queues DG_EVENT_DIALOG_RESULT. DG_ERR_UNSUPPORTED if a dialog is already open on the window; DG_ERR_INVALID_ARGUMENT for a null title, null buttons with count > 0, count above 8, or a button index outside -1..buttons-1."

[[function]]
name = "dg_dialog_close"
ret = "int32_t"
impl = "dialog_close"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2 phase B: closes the window's open dialog without queuing an event (DG_ERR_OK even when none is open). Focus returns where it was."

[[function]]
name = "dg_tabs_add"
ret = "dg_node_t*"
impl = "tabs_add"
params = [{ name = "node", type = "dg_node_t*" }, { name = "label", type = "const char*" }, { name = "disabled", type = "int32_t" }]
summary = "ABI 0.2 phase B: appends a tab labelled `label` (copied; nonzero `disabled` makes it unselectable) to a LIVE DG_NODE_TYPE_TABS and returns its panel: a live column DG_NODE_TYPE_BOX filling the panel area. Insert the tab's content into it with dg_node_insert_before(); removing the panel (dg_node_remove()) leaves the tab with an empty panel. The first selectable tab becomes selected. Null on failure (dg_last_error() says why); at most 64 tabs."

[[function]]
name = "dg_tabs_get_selected"
ret = "int32_t"
impl = "tabs_get_selected"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "ABI 0.2 phase B: the selected tab index of a LIVE DG_NODE_TYPE_TABS, -1 when none, or a DG_ERR_* below -1."

[[function]]
name = "dg_tabs_set_selected"
ret = "int32_t"
impl = "tabs_set_selected"
params = [{ name = "node", type = "dg_node_t*" }, { name = "index", type = "int32_t" }]
summary = "ABI 0.2 phase B: selects tab `index`, showing its panel. Queues no event. DG_ERR_VALUE_OUT_OF_RANGE for an index outside the tabs or a disabled tab."

[[function]]
name = "dg_tree_set_items"
ret = "int32_t"
impl = "tree_set_items"
params = [{ name = "node", type = "dg_node_t*" }, { name = "labels", type = "const char* const*" }, { name = "depths", type = "const int32_t*" }, { name = "flags", type = "const uint32_t*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2 phase B: replaces a LIVE DG_NODE_TYPE_TREE's items with a flattened, pre-order list of `count` entries (copied): labels[i] (null = empty), depths[i] (0 = top level; the first item must be 0 and each item at most one deeper than the one before - an item has children when the next one is deeper), flags[i] (DG_TREE_ITEM_*; `flags` may be null). Clears the selection and scroll offset. DG_ERR_INVALID_ARGUMENT for null arrays with count > 0, bad depths or count above 2^24."

[[function]]
name = "dg_tree_get_selected"
ret = "int32_t"
impl = "tree_get_selected"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "ABI 0.2 phase B: the selected item index of a LIVE DG_NODE_TYPE_TREE, -1 when none, or a DG_ERR_* below -1."

[[function]]
name = "dg_tree_set_selected"
ret = "int32_t"
impl = "tree_set_selected"
params = [{ name = "node", type = "dg_node_t*" }, { name = "index", type = "int32_t" }]
summary = "ABI 0.2 phase B: selects item `index`, expanding its ancestors and scrolling it into view (-1 clears the selection). Queues no event. DG_ERR_VALUE_OUT_OF_RANGE outside -1..count-1."

[[function]]
name = "dg_tree_set_expanded"
ret = "int32_t"
impl = "tree_set_expanded"
params = [{ name = "node", type = "dg_node_t*" }, { name = "index", type = "int32_t" }, { name = "expanded", type = "int32_t" }]
summary = "ABI 0.2 phase B: expands (nonzero) or collapses item `index`. Queues no event. DG_ERR_VALUE_OUT_OF_RANGE for an index outside the items; an item without children is accepted and ignored."

[[function]]
name = "dg_table_set_columns"
ret = "int32_t"
impl = "table_set_columns"
params = [{ name = "node", type = "dg_node_t*" }, { name = "titles", type = "const char* const*" }, { name = "widths", type = "const float*" }, { name = "units", type = "const uint32_t*" }, { name = "flags", type = "const uint32_t*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2 phase B: defines a LIVE DG_NODE_TYPE_TABLE's `count` columns (1..64; copied): titles[i] (null = empty), widths[i] in units[i] (DG_LENGTH_UNIT_PX or _PERCENT of the row width; a width <= 0 - or a null `widths` - shares the remaining space), flags[i] (DG_TABLE_COLUMN_*; null `units`/`flags` mean pixels/0). Clears the rows (push them again with dg_table_set_cells()), the selection and the sort indicator. DG_ERR_INVALID_ARGUMENT for bad arrays, count 0 or above 64, a non-finite width or an unknown unit."

[[function]]
name = "dg_table_set_cells"
ret = "int32_t"
impl = "table_set_cells"
params = [{ name = "node", type = "dg_node_t*" }, { name = "cells", type = "const char* const*" }, { name = "rows", type = "uint32_t" }]
summary = "ABI 0.2 phase B: replaces a LIVE DG_NODE_TYPE_TABLE's rows with `rows` rows of the current column count, read row-major from `cells` (rows x columns strings, copied; a null cell is empty). Clears the selection; the scroll offset is clamped. DG_ERR_INVALID_ARGUMENT for null cells with rows > 0, no columns yet with rows > 0, or rows x columns above 2^24."

[[function]]
name = "dg_table_get_selected"
ret = "int32_t"
impl = "table_get_selected"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "ABI 0.2 phase B: the selected row of a LIVE DG_NODE_TYPE_TABLE, -1 when none, or a DG_ERR_* below -1."

[[function]]
name = "dg_table_set_selected"
ret = "int32_t"
impl = "table_set_selected"
params = [{ name = "node", type = "dg_node_t*" }, { name = "row", type = "int32_t" }]
summary = "ABI 0.2 phase B: selects `row`, scrolling it into view (-1 clears it). Queues no event. DG_ERR_VALUE_OUT_OF_RANGE outside -1..rows-1."

[[function]]
name = "dg_table_set_sort_indicator"
ret = "int32_t"
impl = "table_set_sort_indicator"
params = [{ name = "node", type = "dg_node_t*" }, { name = "column", type = "int32_t" }, { name = "ascending", type = "int32_t" }]
summary = "ABI 0.2 phase B: shows an ascending (nonzero) or descending arrow on header `column` (-1 removes it). drawgui does not sort. DG_ERR_VALUE_OUT_OF_RANGE outside -1..columns-1."

[[function]]
name = "dg_debug_node_count"
ret = "int32_t"
impl = "debug_node_count"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "TEST-ONLY. ABI 0.2 phase B: how many nodes the window's tree holds right now, composed children and open popups included - the leak oracle for component lifetimes (open/close a menu, remove a component: the count returns to its baseline). Negative DG_ERR_* on failure."

[[function]]
name = "dg_slider_get_value"
ret = "int32_t"
impl = "slider_get_value"
params = [{ name = "node", type = "dg_node_t*" }, { name = "out_value", type = "float*" }]
summary = "ABI 0.2: writes a LIVE DG_NODE_TYPE_SLIDER's current value to `out_value`. DG_ERR_INVALID_ARGUMENT for a null `out_value`; DG_ERR_UNSUPPORTED for another node type."

[[function]]
name = "dg_radio_select"
ret = "int32_t"
impl = "radio_select"
params = [{ name = "node", type = "dg_node_t*" }]
summary = "ABI 0.2: selects a LIVE DG_NODE_TYPE_RADIO, clearing the other radios of its group, and repaints them. Queues no event. DG_ERR_UNSUPPORTED for another node type."

[[function]]
name = "dg_app_add_shortcut"
ret = "int32_t"
impl = "app_add_shortcut"
params = [{ name = "app", type = "dg_app_t*" }, { name = "chord", type = "const char*" }, { name = "action_id", type = "uint16_t" }]
summary = "ABI 0.2: binds `chord` (input/shortcuts.toml syntax, e.g. Ctrl+Shift+K) to `action_id` (>= DG_USER_ACTION_BASE) in every window of the app (router level 4); it queues DG_EVENT_ACTION with a null node. Rebinding a chord replaces it. DG_ERR_INVALID_ARGUMENT for a chord that does not parse or an id below DG_USER_ACTION_BASE."

[[function]]
name = "dg_window_add_shortcut"
ret = "int32_t"
impl = "window_add_shortcut"
params = [{ name = "scope", type = "dg_node_t*" }, { name = "chord", type = "const char*" }, { name = "action_id", type = "uint16_t" }]
summary = "ABI 0.2: binds `chord` to `action_id` (>= DG_USER_ACTION_BASE) while focus is inside the LIVE node `scope` (router level 2); DG_EVENT_ACTION names `scope`."

[[function]]
name = "dg_app_remove_shortcut"
ret = "int32_t"
impl = "app_remove_shortcut"
params = [{ name = "app", type = "dg_app_t*" }, { name = "chord", type = "const char*" }]
summary = "ABI 0.2: drops every dg_app_add_shortcut()/dg_window_add_shortcut() binding of `chord`. DG_ERR_UNKNOWN_ID when there is none."

[[function]]
name = "dg_chord_label"
ret = "const char*"
impl = "chord_label"
params = [{ name = "app", type = "dg_app_t*" }, { name = "chord", type = "const char*" }]
summary = "ABI 0.2: the platform label of `chord` (e.g. Ctrl+K), or NULL when it does not parse. Valid until the next dg_chord_label() call on this thread."

[[function]]
name = "dg_app_load_image"
ret = "int32_t"
impl = "app_load_image"
params = [{ name = "app", type = "dg_app_t*" }, { name = "bytes", type = "const void*" }, { name = "len", type = "uint32_t" }, { name = "svg_tint_argb", type = "uint32_t" }]
summary = "ABI 0.2: decodes a PNG/JPEG/WebP/SVG (sniffed, as dg_node_set_image_data()) once and returns its image id (positive) for the icon arrays of dg_list_set_rows()/dg_tree_set_items_ex()/dg_table_set_cells_ex()/dg_list_set_row_actions(), or a negative DG_ERR_*. Images live as long as the app."

[[function]]
name = "dg_app_load_image_file"
ret = "int32_t"
impl = "app_load_image_file"
params = [{ name = "app", type = "dg_app_t*" }, { name = "path", type = "const char*" }, { name = "svg_tint_argb", type = "uint32_t" }]
summary = "ABI 0.2: dg_app_load_image() with the bytes read from `path`."

[[function]]
name = "dg_list_set_rows"
ret = "int32_t"
impl = "list_set_rows"
params = [{ name = "node", type = "dg_node_t*" }, { name = "texts", type = "const char* const*" }, { name = "secondaries", type = "const char* const*" }, { name = "icons", type = "const uint32_t*" }, { name = "flags", type = "const uint32_t*" }, { name = "trailing_actions", type = "const uint32_t*" }, { name = "count", type = "uint32_t" }, { name = "item_height", type = "int32_t" }]
summary = "ABI 0.2: dg_list_set_items() with rich rows: texts[i], secondaries[i] (dimmed second text), icons[i] (a dg_app_load_image() id, 0 = none), flags[i] (DG_ROW_*), trailing_actions[i] (how many of dg_list_set_row_actions()' buttons it shows, 0..8). Every array but `texts` may be null; a null string is empty."

[[function]]
name = "dg_list_set_row_actions"
ret = "int32_t"
impl = "list_set_row_actions"
params = [{ name = "node", type = "dg_node_t*" }, { name = "icons", type = "const uint32_t*" }, { name = "tooltips", type = "const char* const*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2: the trailing action buttons (at most 8; icon ids and tooltips, either array may be null) the rows of a DG_NODE_TYPE_LIST pick from. A press queues DG_EVENT_ROW_PART with x = DG_ROW_PART_ACTION."

[[function]]
name = "dg_list_row_checked"
ret = "int32_t"
impl = "list_row_checked"
params = [{ name = "node", type = "dg_node_t*" }, { name = "row", type = "int32_t" }]
summary = "ABI 0.2: 1/0 for a dg_list_set_rows() row's check box, or a negative DG_ERR_* (DG_ERR_NOT_APPLICABLE for a row without one)."

[[function]]
name = "dg_tree_set_items_ex"
ret = "int32_t"
impl = "tree_set_items_ex"
params = [{ name = "node", type = "dg_node_t*" }, { name = "labels", type = "const char* const*" }, { name = "depths", type = "const int32_t*" }, { name = "flags", type = "const uint32_t*" }, { name = "icons", type = "const uint32_t*" }, { name = "secondaries", type = "const char* const*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2: dg_tree_set_items() plus icons[i] (image ids, 0 = none), secondaries[i] and flags[i]'s DG_TREE_ITEM_CHECKABLE/CHECKED. `icons`/`secondaries` may be null."

[[function]]
name = "dg_tree_row_checked"
ret = "int32_t"
impl = "tree_row_checked"
params = [{ name = "node", type = "dg_node_t*" }, { name = "index", type = "int32_t" }]
summary = "ABI 0.2: 1/0 for a dg_tree_set_items_ex() item's check box, or a negative DG_ERR_*."

[[function]]
name = "dg_table_set_cells_ex"
ret = "int32_t"
impl = "table_set_cells_ex"
params = [{ name = "node", type = "dg_node_t*" }, { name = "cells", type = "const char* const*" }, { name = "icons", type = "const uint32_t*" }, { name = "flags", type = "const uint32_t*" }, { name = "rows", type = "uint32_t" }]
summary = "ABI 0.2: dg_table_set_cells() plus row-major icons (image ids, 0 = none) and flags (DG_ROW_*) per cell; either may be null."

[[function]]
name = "dg_table_cell_checked"
ret = "int32_t"
impl = "table_cell_checked"
params = [{ name = "node", type = "dg_node_t*" }, { name = "row", type = "int32_t" }, { name = "column", type = "int32_t" }]
summary = "ABI 0.2: 1/0 for a dg_table_set_cells_ex() cell's check box, or a negative DG_ERR_*."

[[function]]
name = "dg_list_set_row_keys"
ret = "int32_t"
impl = "list_set_row_keys"
params = [{ name = "node", type = "dg_node_t*" }, { name = "keys", type = "const uint64_t*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2: one app key per row of a DG_NODE_TYPE_LIST (count must equal the row count; replaced by the next dg_list_set_items()/dg_list_set_rows()). Echoed as dg_event::item_key; never dereferenced."

[[function]]
name = "dg_tree_set_item_keys"
ret = "int32_t"
impl = "tree_set_item_keys"
params = [{ name = "node", type = "dg_node_t*" }, { name = "keys", type = "const uint64_t*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2: one app key per pre-order item of a DG_NODE_TYPE_TREE (count must equal the item count; replaced by the next dg_tree_set_items*()). Echoed as dg_event::item_key."

[[function]]
name = "dg_table_set_row_keys"
ret = "int32_t"
impl = "table_set_row_keys"
params = [{ name = "node", type = "dg_node_t*" }, { name = "keys", type = "const uint64_t*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2: one app key per row of a DG_NODE_TYPE_TABLE (count must equal the row count; cleared by the next dg_table_set_cells*()). Echoed as dg_event::item_key."

[[function]]
name = "dg_menubar_set_menus"
ret = "int32_t"
impl = "menubar_set_menus"
params = [{ name = "node", type = "dg_node_t*" }, { name = "titles", type = "const char* const*" }, { name = "entry_counts", type = "const uint32_t*" }, { name = "menu_count", type = "uint32_t" }, { name = "labels", type = "const char* const*" }, { name = "shortcut_labels", type = "const char* const*" }, { name = "flags", type = "const uint32_t*" }, { name = "commands", type = "const int32_t*" }, { name = "entry_total", type = "uint32_t" }]
summary = "ABI 0.2: replaces a DG_NODE_TYPE_MENUBAR's menus: `menu_count` titles, menu i owning the next entry_counts[i] entries of the flattened labels/shortcut_labels/flags (DG_MENU_ITEM_*)/commands arrays (`entry_total` = their sum; shortcut_labels/flags/commands may be null)."

[[function]]
name = "dg_menubar_set_entry"
ret = "int32_t"
impl = "menubar_set_entry"
params = [{ name = "node", type = "dg_node_t*" }, { name = "menu", type = "int32_t" }, { name = "item", type = "int32_t" }, { name = "label", type = "const char*" }, { name = "shortcut_label", type = "const char*" }, { name = "flags", type = "uint32_t" }, { name = "command", type = "int32_t" }]
summary = "ABI 0.2: replaces one entry of a menu bar menu. DG_ERR_VALUE_OUT_OF_RANGE for a missing menu/item."

[[function]]
name = "dg_menu_open_ex"
ret = "int32_t"
impl = "menu_open_ex"
params = [{ name = "window", type = "dg_window_t*" }, { name = "anchor", type = "dg_node_t*" }, { name = "x", type = "int32_t" }, { name = "y", type = "int32_t" }, { name = "labels", type = "const char* const*" }, { name = "flags", type = "const uint32_t*" }, { name = "shortcut_labels", type = "const char* const*" }, { name = "commands", type = "const int32_t*" }, { name = "count", type = "uint32_t" }]
summary = "ABI 0.2: dg_menu_open() plus right-aligned shortcut labels and per-entry commands (echoed in DG_EVENT_MENU_ACTIVATE's `command`); either array may be null."

[[function]]
name = "dg_dialog_open_ex"
ret = "int32_t"
impl = "dialog_open_ex"
params = [{ name = "window", type = "dg_window_t*" }, { name = "title", type = "const char*" }, { name = "body", type = "const char*" }, { name = "buttons", type = "const char* const*" }, { name = "count", type = "uint32_t" }, { name = "default_button", type = "int32_t" }, { name = "cancel_button", type = "int32_t" }, { name = "content", type = "dg_node_t*" }]
summary = "ABI 0.2: dg_dialog_open() plus `content` (may be null): a LIVE node of `window` the dialog body shows below `body` while open; it is detached (alive, parentless) when the dialog closes."

[[function]]
name = "dg_dialog_set_button_disabled"
ret = "int32_t"
impl = "dialog_set_button_disabled"
params = [{ name = "window", type = "dg_window_t*" }, { name = "dialog_id", type = "int32_t" }, { name = "button", type = "int32_t" }, { name = "disabled", type = "int32_t" }]
summary = "ABI 0.2: disables (nonzero) or enables one button of the open dialog `dialog_id`. DG_ERR_UNKNOWN_ID when it is not open; DG_ERR_VALUE_OUT_OF_RANGE for a missing button."

[[function]]
name = "dg_window_set_close_confirmation"
ret = "int32_t"
impl = "window_set_close_confirmation"
params = [{ name = "window", type = "dg_window_t*" }, { name = "enabled", type = "int32_t" }]
summary = "ABI 0.2: nonzero makes the title-bar close of `window` queue DG_EVENT_CLOSE_REQUESTED instead of closing it; 0 (the default) closes it at once (DG_EVENT_WINDOW_CLOSED)."

[[function]]
name = "dg_window_close"
ret = "int32_t"
impl = "window_close"
params = [{ name = "window", type = "dg_window_t*" }]
summary = "ABI 0.2: closes `window` now and queues DG_EVENT_WINDOW_CLOSED; the handle is stale afterwards (DG_ERR_INVALID_HANDLE once closed)."

[[function]]
name = "dg_node_animate"
ret = "int32_t"
impl = "node_animate"
params = [{ name = "node", type = "dg_node_t*" }, { name = "prop_id", type = "uint16_t" }, { name = "from", type = "const dg_value*" }, { name = "to", type = "const dg_value*" }, { name = "duration_ms", type = "uint32_t" }, { name = "curve", type = "uint32_t" }]
summary = "ABI 0.2: interpolates a LIVE node's float/length/colour property from `from` (null = its current value; readable for background/border colour, opacity, left/top/width/height, else DG_ERR_UNSUPPORTED) to `to` over `duration_ms` with DG_CURVE_*, advanced by dg_wait_events()/dg_poll_events() (which wake about every 16 ms while anything animates). Returns the animation id (> 0; DG_EVENT_ANIMATION_FINISHED repeats it), 0 when the property is of another type and jumped to `to` at once, or a negative DG_ERR_*. dg_app_set_reduced_motion() makes it land at the next pump."

[[function]]
name = "dg_node_set_transition"
ret = "int32_t"
impl = "node_set_transition"
params = [{ name = "node", type = "dg_node_t*" }, { name = "prop_id", type = "uint16_t" }, { name = "duration_ms", type = "uint32_t" }, { name = "curve", type = "uint32_t" }]
summary = "ABI 0.2: every later dg_node_set_prop() of `prop_id` on this LIVE node interpolates to the new value over `duration_ms` with DG_CURVE_* (from the in-flight value when one is running). 0 ms removes the transition."

[[function]]
name = "dg_animation_cancel"
ret = "int32_t"
impl = "animation_cancel"
params = [{ name = "window", type = "dg_window_t*" }, { name = "animation", type = "int32_t" }]
summary = "ABI 0.2: stops a dg_node_animate() animation of `window` where it is (no DG_EVENT_ANIMATION_FINISHED). DG_ERR_UNKNOWN_ID once it finished, was cancelled or its node was removed."

[[function]]
name = "dg_app_set_reduced_motion"
ret = "int32_t"
impl = "app_set_reduced_motion"
params = [{ name = "app", type = "dg_app_t*" }, { name = "enabled", type = "int32_t" }]
summary = "ABI 0.2: nonzero makes every animation and transition of every window of `app` take zero time (the user's reduced-motion preference, read by the host)."
