#        dg_tree_set_item_keys(), dg_table_set_row_keys(), dg_event's
#        appended item_key: sizeof(dg_event) 48 -> 56 on a 64-bit target).
#        Runtime loop: window close confirmation
#        (dg_window_set_close_confirmation(), DG_EVENT_CLOSE_REQUESTED,
#        dg_window_close()); animation driven by the pump
#        (dg_node_animate(), dg_node_set_transition(), dg_animation_cancel(),
#        DG_CURVE_*, DG_EVENT_ANIMATION_FINISHED, dg_app_set_reduced_motion()).
[meta]
abi_major = 0
abi_minor = 2

# --- Opaque handle types -----------------------------------------------------
#
# Every one of these is a pointer to a small, NEVER-FREED wrapper allocated
# once by the function that hands it out ({index, generation} - 8 bytes),
# never the resource itself. "Never freed" is load-bearing, not sloppy: a
# host dereferencing a handle after dg_node_remove()/dg_app_destroy() reads
# two ordinary, still-allocated integers rather than freed memory, so a
# stale-handle bug is an ordinary, ASan-silent DG_ERR_INVALID_HANDLE return
# instead of a real use-after-free, and 6-1's AnimHandle{index,
# generation} for the precedent this generalises from one resource kind
# (animation slots) to four (apps, windows, nodes, and node-arena entries).

[[opaque_type]]
name = "dg_app_t"
summary = "One drawgui application: the window manager and every window/node arena it owns."

[[opaque_type]]
name = "dg_window_t"
summary = "One OS window and the layout/render/widget state painted into it."

[[opaque_type]]
name = "dg_node_t"
summary = "One layout/render node - pending (not yet in a tree) or live (attached under a window)."

[[opaque_type]]
name = "dg_theme_t"
summary = "7-6: one loaded theme (a token->value table plus, optionally, the untrusted package directory it came from), owned by the app that loaded it."

# --- Structs -----------------------------------------------------------------
#
# Every struct's FIRST field is `size` (design.md section 5.8 decision 4):
# sizeof(the struct) as the caller's build understands it, so a future
# MINOR version that appends a field can tell an old, shorter caller-built
# struct from a current one instead of reading past the end of it.

[[struct]]
name = "dg_value"
summary = "One property value, tagged - the ABI's dg::PropValue (node_props.h)."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_value)." },
  { name = "type", type = "uint32_t", summary = "DG_VALUE_* - which field below is meaningful." },
  { name = "number", type = "float", summary = "meaningful for DG_VALUE_FLOAT / DG_VALUE_LENGTH." },
  { name = "bits", type = "uint32_t", summary = "ARGB for DG_VALUE_COLOR, ordinal for DG_VALUE_ENUM, 0/1 for DG_VALUE_BOOL, token_id for DG_VALUE_TOKEN, DG_LENGTH_UNIT_* for DG_VALUE_LENGTH (ABI 0.2; 0 = pixels, what it always meant)." },
]

[[struct]]
name = "dg_app_opts"
summary = "Reserved for future app-level options. Empty today; `size` alone makes it extensible."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_app_opts)." },
]

[[struct]]
name = "dg_window_opts"
summary = "What a window should be when it appears - dg::WindowSpec at the ABI boundary."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_window_opts)." },
  { name = "title", type = "const char*", summary = "copied at dg_window_create() time; not retained." },
  { name = "width", type = "int32_t", summary = "initial width in device pixels." },
  { name = "height", type = "int32_t", summary = "initial height in device pixels." },
  { name = "background_argb", type = "uint32_t", summary = "0xAARRGGBB fill until the first frame paints." },
  { name = "resizable", type = "int32_t", summary = "ABI 0.2: nonzero lets the user resize the window. Read only when `size` covers it; an older, shorter struct gets 0 (not resizable), what every window was before." },
  { name = "min_width", type = "int32_t", summary = "ABI 0.2: minimum width, logical units; 0 = no limit. Read only when `size` covers it." },
  { name = "min_height", type = "int32_t", summary = "ABI 0.2: minimum height; 0 = no limit." },
  { name = "max_width", type = "int32_t", summary = "ABI 0.2: maximum width; 0 = no limit." },
  { name = "max_height", type = "int32_t", summary = "ABI 0.2: maximum height; 0 = no limit." },
]

[[struct]]
name = "dg_event"
summary = "One entry of dg_poll_events() - the C shape of dg::PumpResult, flattened to one kind at a time."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_event)." },
  { name = "kind", type = "uint32_t", summary = "DG_EVENT_*." },
  { name = "window", type = "dg_window_t*", summary = "which window this event is about." },
  { name = "node", type = "dg_node_t*", summary = "DG_EVENT_CLICK: the clicked node. DG_EVENT_ACTION: the resolved action's target node - design.md section 5.5.2 level 2, a focused node's own dg_node_scope_action() binding - or null for a level-4 app-wide action, which names no node. ABI 0.2: DG_EVENT_TEXT_CHANGED the editor; DG_EVENT_FOCUS_CHANGED the newly focused node (null = none); DG_EVENT_CONTEXT_CLICK the nearest node with a handle under the pointer; DG_EVENT_LIST_SELECT the list. Phase B: DG_EVENT_MENU_ACTIVATE/_DISMISS the menu's anchor (or null); DG_EVENT_VALUE_CHANGED the dropdown; DG_EVENT_TAB_SELECT, DG_EVENT_TREE_* and DG_EVENT_TABLE_* the component; DG_EVENT_SLIDER_CHANGED the slider. Null for every other kind (DG_EVENT_DIALOG_RESULT included)." },
  { name = "x", type = "int32_t", summary = "DG_EVENT_CLICK: the pointer position, device pixels. DG_EVENT_WINDOW_MOVED: the new left edge, logical screen coordinates. DG_EVENT_WINDOW_RESIZED: the new drawable WIDTH, device pixels. ABI 0.2: DG_EVENT_CONTEXT_CLICK the pointer x; DG_EVENT_LIST_SELECT the row index; DG_EVENT_TIMER the timer id; DG_EVENT_USER the payload's low 32 bits. Phase B: DG_EVENT_MENU_ACTIVATE the item index (-1 for _DISMISS); DG_EVENT_VALUE_CHANGED the new option; DG_EVENT_DIALOG_RESULT the button (-1 = Escape without a cancel button); DG_EVENT_TAB_SELECT the tab; DG_EVENT_TREE_* the item; DG_EVENT_TABLE_SELECT the row; DG_EVENT_TABLE_SORT the column. 0 for every other kind, including DG_EVENT_ACTION." },
  { name = "y", type = "int32_t", summary = "DG_EVENT_CLICK: the pointer position, device pixels. DG_EVENT_WINDOW_MOVED: the new top edge, logical screen coordinates. DG_EVENT_WINDOW_RESIZED: the new drawable HEIGHT, device pixels. ABI 0.2: DG_EVENT_CONTEXT_CLICK the pointer y; DG_EVENT_USER the payload's high 32 bits. Phase B: DG_EVENT_MENU_ACTIVATE/_DISMISS the menu id; DG_EVENT_VALUE_CHANGED the previous option (-1 = none); DG_EVENT_DIALOG_RESULT the dialog id. 0 for every other kind, including DG_EVENT_ACTION." },
  { name = "action_id", type = "uint16_t", summary = "8-3d: DG_EVENT_ACTION only - the resolved dg_action_id (input/shortcuts.toml, design.md section 5.5.3). DG_ACTION_INVALID (0) for every other kind. Appended at the end of the struct, after `y` - dg_event's own `size` field (design.md section 5.8 decision 4) is exactly the mechanism that makes this an allowed MINOR addition rather than a break; see abi/drawgui_abi.lock's own append-only rule." },
  { name = "clicks", type = "uint16_t", summary = "ABI 0.2: DG_EVENT_CLICK, DG_EVENT_CONTEXT_CLICK, DG_EVENT_LIST_SELECT and (phase B) a pointer-made DG_EVENT_TABLE_SELECT - the press's click count (1 single, 2 double, 3 triple...), from the platform or counted by drawgui with the same thresholds; 0 for a DG_EVENT_CLICK an arrow key made by selecting a DG_NODE_TYPE_RADIO. 0 for every other kind. It sits in what used to be the struct's tail padding, so sizeof(dg_event) is unchanged (40 bytes on a 64-bit target)." },
  { name = "item", type = "int32_t", summary = "ABI 0.2: DG_EVENT_CLICK/DG_EVENT_CONTEXT_CLICK on a LIST/TABLE row (the row) or a TREE item (the pre-order item); DG_EVENT_ROW_PART the row/item; DG_EVENT_MENU_ACTIVATE the item index. -1 for every other kind or a press outside the rows. Appended (with `column` and `command`): sizeof(dg_event) grows from 40 to 56 on a 64-bit target; `size` tells which fields a struct has." },
  { name = "column", type = "int32_t", summary = "ABI 0.2: DG_EVENT_CLICK/DG_EVENT_CONTEXT_CLICK/DG_EVENT_ROW_PART on a TABLE: the column. DG_EVENT_MENU_ACTIVATE/_DISMISS of a DG_NODE_TYPE_MENUBAR menu: the bar menu index. -1 otherwise." },
  { name = "command", type = "int32_t", summary = "ABI 0.2: DG_EVENT_MENU_ACTIVATE: the chosen entry's command (dg_menu_open_ex()/dg_menubar_*; 0 = none). 0 for every other kind." },
  { name = "item_key", type = "uint64_t", summary = "ABI 0.2: DG_EVENT_CLICK/DG_EVENT_CONTEXT_CLICK/DG_EVENT_ROW_PART on a LIST/TREE/TABLE row: the app's key for that row (dg_list_set_row_keys()/dg_tree_set_item_keys()/dg_table_set_row_keys(); never dereferenced). 0 = none / every other kind. Appended: sizeof(dg_event) grows from 48 to 56 on a 64-bit target." },
]

[[struct]]
name = "dg_theme_err"
summary = "7-6: out-param naming why dg_theme_load_dir()/dg_theme_load_memory() failed. The human-readable detail (a JSON key path or a byte offset) is dg_last_error(), matching every other failing call in this ABI; this struct carries only the machine-checkable status, so a host can branch on it without string-parsing dg_last_error()'s text."
fields = [
  { name = "size", type = "uint32_t", summary = "sizeof(dg_theme_err)." },
  { name = "status", type = "uint32_t", summary = "DG_THEME_ERR_* - mirrors dg::ThemeLoadStatus." },
]

# --- Constant groups -----------------------------------------------------------
#
# Every group emits plain `#define NAME value` constants, matching this
# project's own prop_id/token_id convention (never an enum: a value crossing
# the ABI arrives from outside the process, so the set it may hold is every
# value the underlying integer type can carry, not the set spelled out
# below - prop_ids.generated.h's own comment records the clang-tidy findings
# that made this the house rule, and the same reasoning applies unchanged
# here). Locked by tools/abi_lock.py exactly like props/prop_ids.lock:
# append-only, never renumbered, never reused.

[[constant_group]]
name = "node_type"
prefix = "DG_NODE_TYPE_"
c_type = "uint16_t"
summary = "dg_node_create()'s type_id - the minimum vocabulary the acceptance criterion needs."
values = [
  { name = "BOX", id = 1, summary = "A plain, non-interactive leaf (WidgetKind::kPanel)." },
  { name = "BUTTON", id = 2, summary = "A clickable leaf (WidgetKind::kButton): hover/press/click, three fills. ABI 0.2: the fills and text colour come from the theme (color.primary/-hover/-pressed, color.on-primary) and follow a theme switch; a DG_PROP_BACKGROUND_COLOR (hover/press shades derived from it) or DG_PROP_TEXT_COLOR written or token-bound on it wins over the theme." },
  { name = "LABEL", id = 3, summary = "P6 sub-step a1: static text (WidgetKind::kLabel), not interactive - a click inside it belongs to whatever ancestor accepts it. Carries an engine-chosen default font (the app's dg_app_add_font() primary family) and size the instant it is created; dg_node_set_text(DG_PROP_TEXT) sets its string, dg_node_set_prop(DG_PROP_TEXT_COLOR) its colour." },
  { name = "CHECKBOX", id = 4, summary = "P6 sub-step a2: a clickable toggle (WidgetKind::kCheckbox) - unchecked by default, DG_EVENT_CLICK fires on a completed press+release exactly like DG_NODE_TYPE_BUTTON, and the click ALSO flips the checked bit (dg::WidgetSet::toggle()) before that event is queued, so a caller reacting to the click can immediately dg_node_get_checked() the new state. A caller-invisible INDICATOR CHILD is composed at attach time (examples/11_form_controls/form_scene.cpp's add_toggle() recipe, copied unchanged) to give the checked/unchecked fill somewhere to paint - it has no dg_node_t handle and cannot be reached, inserted into, or removed through this ABI; this is a deliberate trade, not an oversight, because a reactive framework built on this ABI (P6's own eventual c/d steps) cannot be made to hand-compose a child for every checkbox it creates. Never grouped: a mutually exclusive option is ABI 0.2's DG_NODE_TYPE_RADIO." },
  { name = "TEXT_FIELD", id = 5, summary = "P6 sub-step a2 (second half): a single-line editable text field (WidgetKind::kTextField), examples/12_text_input's own recipe copied unchanged. A click focuses it (this ABI's existing dg::Focus, driven by process_pointer_event() exactly like every other focusable widget already is) and starts real text input on its window (WindowManager::start_text_input()); a committed SDL_EVENT_TEXT_INPUT then reaches it through dg_wait_events()/dg_poll_events()'s internal pump, which now also drains dg::PumpResult::text_input and calls dg::WidgetSet::text_field_insert(), queuing one DG_EVENT_TEXT_CHANGED per commit. Left/Right/Home/End/Backspace/Delete are dispatched directly by key, exactly like examples/12_text_input/text_field_window.cpp's own Runner::handle_key() - NOT through design.md section 5.5.2's four-level router: the router's ActionScope::kTextField only ever carries the four clipboard actions (copy/cut/paste/select_all, dg::clipboard_actions.h), never text_field_move/backspace/delete_forward, so there is no ActionId to resolve a caret move through and this ABI does not invent one. FOUR caller-invisible children are composed at attach time exactly like DG_NODE_TYPE_CHECKBOX's indicator (Widget::content/caret/selection_highlight/composition_underline) - none has a dg_node_t handle. `composition_underline` is built but never driven: this ABI exports no IME/composition surface at all (see this file's own \"明确不做\" entry below) - a field can never enter `composing`, so the underline stays zero-size forever, the same 'built but permanently dormant' shape as an ungrouped checkbox's unused Widget::group field. Read the field's current text with dg_node_get_text(); dg_node_set_text(DG_PROP_TEXT) sets its initial/replacement content the same way it already does for DG_NODE_TYPE_LABEL. ABI 0.2: Mod+Z undoes and Mod+Shift+Z/Mod+Y redo (the pump applies them to the focused editor before the router - typing within a second merges into one step, a paste/cut/IME commit is its own; DG_EVENT_TEXT_CHANGED when the text changed), Ctrl+Left/Right move by word (Shift extends), Ctrl+Backspace/Delete delete a word, a double-click selects a word and a triple-click the whole text (a text area: the logical line)." },
  { name = "TEXT_AREA", id = 6, summary = "ABI 0.2: a multi-line, soft-wrapping editable text area (WidgetKind::kTextArea), 320x160 by default, styled with DG_NODE_TYPE_TEXT_FIELD's own palette. Everything DG_NODE_TYPE_TEXT_FIELD does (click to focus and place the caret, committed text input, DG_EVENT_TEXT_CHANGED, dg_node_get_text(), the clipboard actions, undo/redo, word moves/deletes and double/triple-click selection - see DG_NODE_TYPE_TEXT_FIELD) plus: Enter (bare or with Shift) inserts a newline - Ctrl/Alt+Enter still reach the shortcut router; Up/Down keep the caret's column across lines; Home/End go to the visual (wrapped) line's ends, Ctrl+Home/End to the text's; PageUp/PageDown move by the viewport; a press-drag selects; the wheel and the area's own scrollbar (theme tokens color.scrollbar-track/thumb and size.scrollbar) scroll without moving the caret, and the caret is scrolled into view after every edit or move. Tab stays focus traversal. Its composed children (selection highlights, IME underlines, content, caret, scrollbar track and thumb) have no dg_node_t handle. dg_node_set_text(DG_PROP_TEXT) on a text area or text field replaces the EDITOR'S text (caret to the end) and queues no DG_EVENT_TEXT_CHANGED." },
  { name = "SCROLL_VIEW", id = 7, summary = "ABI 0.2: a clipping viewport (WidgetKind::kScrollView), 240x160 by default, that scrolls ONE caller-invisible content child. dg_node_insert_before(scroll_view, child, ref) puts `child` into that content node, so a scroll view takes any number of children; the content is a column (vertical scrolling, the default) or a row (DG_PROP_SCROLL_AXIS = DG_SCROLL_AXIS_HORIZONTAL), sized to its children. DG_PROP_DIRECTION/JUSTIFY/ALIGN/GAP/MAIN_SIZE/WRAP/RUN_GAP/ALIGN_CONTENT written to the scroll view apply to the content node; every other property applies to the viewport. The wheel over it scrolls it, its scrollbar (DG_PROP_SCROLLBAR, theme tokens color.scrollbar-* and size.scrollbar, a reserved gutter on the trailing edge set through the viewport's padding) can be dragged or paged, and PageUp/PageDown/Home/End scroll it while a node inside it has focus (the bound DG_ACTION_SCROLL_* action is applied, then still reported as DG_EVENT_ACTION). dg_node_get_scroll_offset() reads the offset. Writing DG_PROP_PADDING_R/B on it replaces the gutter." },
  { name = "LIST", id = 8, summary = "ABI 0.2: a virtualized single-column list of text rows (WidgetKind::kList), 240x200 by default: a fixed pool of 32 row nodes is recycled while it scrolls, so its item count is unbounded, but at most 30 rows can be visible at once (taller lists show empty space). The data is pushed, not pulled: dg_list_set_items() copies an array of UTF-8 strings; rows are 28px tall unless dg_list_set_items() says otherwise. A primary press on a row selects it (dg_list_get_selected()/dg_list_set_selected(); the row is filled with color.primary at reduced opacity) and queues DG_EVENT_LIST_SELECT. The wheel and its scrollbar scroll it, as for DG_NODE_TYPE_SCROLL_VIEW. Rows draw with the default font in color.on-surface; DG_PROP_FONT_SIZE on the list sets their size. Focusable (a press, Tab, dg_node_focus()): while focused, Up/Down/Home/End/PageUp/PageDown move the selection, scroll it into view and queue DG_EVENT_LIST_SELECT with `clicks` 0; Space toggles the selected row's check box (DG_EVENT_ROW_PART)." },
  { name = "IMAGE", id = 9, summary = "ABI 0.2: a box that paints a decoded image (no fill of its own), 64x64 by default. dg_node_set_image_data()/dg_node_set_image_file() set its picture (PNG, JPEG, WebP or SVG); DG_PROP_IMAGE_FIT (default DG_IMAGE_FIT_CONTAIN) and DG_PROP_IMAGE_PLACEHOLDER_COLOR apply. The image setters also work on a DG_NODE_TYPE_BOX." },
  { name = "DROPDOWN", id = 10, summary = "ABI 0.2 phase B: a dropdown (WidgetKind::kDropdown, dg::Dropdown), 200x32 by default: a bordered button showing the selected option's text. A primary press (or Down/Enter while focused) opens the option menu as an overlay popup; choosing a different option queues DG_EVENT_VALUE_CHANGED. dg_dropdown_set_items() sets the options, dg_dropdown_get_selected()/dg_dropdown_set_selected() read/write the selection; dg_node_set_text(DG_PROP_TEXT) sets the placeholder shown while nothing is selected. Focusable. Colours come from the theme (color.surface/on-surface/border)." },
  { name = "PROGRESS", id = 11, summary = "ABI 0.2 phase B: a progress bar (dg::ProgressBar), 200x8 by default; the track and fill fill the node. DG_PROP_VALUE (DG_VALUE_FLOAT, 0..1) sets the fraction; DG_PROP_INDETERMINATE (DG_VALUE_BOOL) switches to an endless sweep animated by dg_wait_events() (it wakes about every 16 ms while one is visible). Not focusable." },
  { name = "TABS", id = 12, summary = "ABI 0.2 phase B: a tab strip with one panel per tab (dg::Tabs), 320x240 by default. dg_tabs_add() appends a tab and returns its panel - a live column DG_NODE_TYPE_BOX filling the panel area that takes children through dg_node_insert_before(). Only the selected panel is shown; hidden panels are disabled (they leave Tab order). A primary press on a tab, or Left/Right/Home/End/Enter while a tab has focus, selects it and queues DG_EVENT_TAB_SELECT. dg_tabs_get_selected()/dg_tabs_set_selected()." },
  { name = "TREE", id = 13, summary = "ABI 0.2 phase B: a virtualized tree view (dg::TreeView), 240x240 by default. dg_tree_set_items() pushes a flattened, depth-annotated item list (copied). Clicks and Up/Down/Left/Right/Home/End/PageUp/PageDown/Enter select, expand and collapse (DG_EVENT_TREE_SELECT/_EXPAND/_COLLAPSE); the wheel and its scrollbar scroll it. Focusable. DG_PROP_HEIGHT sizes it; percentage heights, DG_PROP_GROW and a parent's stretch are honoured too (the viewport follows the laid-out size after each layout)." },
  { name = "TABLE", id = 14, summary = "ABI 0.2 phase B: a virtualized table with a header row (dg::Table), 360x240 by default. dg_table_set_columns() defines columns (title, width, sortable), dg_table_set_cells() pushes the row-major cell strings (copied). A press on a row (or Up/Down/Home/End/PageUp/PageDown while focused) selects it - DG_EVENT_TABLE_SELECT; a press on a sortable header queues DG_EVENT_TABLE_SORT - the caller sorts its data, pushes it again and calls dg_table_set_sort_indicator(). Focusable. DG_PROP_HEIGHT sizes it; percentage heights, DG_PROP_GROW and a parent's stretch are honoured too (the viewport follows the laid-out size after each layout)." },
  { name = "SLIDER", id = 15, summary = "ABI 0.2: a horizontal slider (WidgetKind::kSlider), 200x20 by default: a rounded track (theme color.border) and a round thumb as tall as the track (color.primary), a caller-invisible composed child. DG_PROP_VALUE (DG_VALUE_FLOAT) sets the value, clamped to [DG_PROP_MIN_VALUE, DG_PROP_MAX_VALUE] (default 0..100) and snapped to min + k * DG_PROP_STEP (default 0 = continuous); a min not below the max, a max not above the min, a negative step or a non-finite number is DG_ERR_VALUE_OUT_OF_RANGE, and a range or step change re-clamps the value. A primary press on it moves the thumb under the pointer, focuses it and starts a drag that follows the pointer until the release; while focused, Left/Down and Right/Up move it one step (1/100 of the range when continuous), PageDown/PageUp a tenth of the range, Home/End to the ends. Each user change queues DG_EVENT_SLIDER_CHANGED; read the value with dg_slider_get_value(). DG_PROP_DISABLED stops all of it and paints the theme's disabled colours. DG_PROP_HEIGHT resizes the thumb with the track. Takes no children." },
  { name = "RADIO", id = 16, summary = "ABI 0.2: a radio button - a round DG_NODE_TYPE_CHECKBOX (32x32, a 20x20 dot, the checkbox's colours) in group DG_PROP_RADIO_GROUP (an integer, default 0) of its window: selecting one clears every other radio of that group. A completed primary click selects it (a no-op when already selected) before queuing DG_EVENT_CLICK, exactly like a checkbox; dg_node_get_checked() reads it and dg_radio_select() selects it without an event. While a radio has focus, Left/Up and Right/Down move focus AND the selection to the previous/next enabled radio of its group in creation order, wrapping, and queue DG_EVENT_CLICK on it with clicks = 0 and x/y = 0. Each radio is its own Tab stop." },
  { name = "MENUBAR", id = 17, summary = "ABI 0.2: a horizontal menu bar (dg_menubar_set_menus()/dg_menubar_set_entry()). A press on a title drops its menu down; choosing an entry queues DG_EVENT_MENU_ACTIVATE with `node` = the bar, `column` = the bar menu, `x`/`item` = the entry and `command` its command. Takes no children." },
]

