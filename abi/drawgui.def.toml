[[constant_group]]
name = "event_kind"
prefix = "DG_EVENT_"
c_type = "uint32_t"
summary = "dg_event::kind."
values = [
  { name = "WINDOW_CLOSED", id = 1, summary = "The window closed (user or dg_debug_ script); the dg_window_t handle is now stale." },
  { name = "CLICK", id = 2, summary = "A press and its release landed on the same node - dg::InteractionChange::clicked." },
  { name = "ACTION", id = 3, summary = "8-3d: a key resolved to a bound intent through design.md section 5.5.2's four-level router (dg::route_key_event()/resolve_action()) - dg_event::action_id names which one, dg_event::node its target (null for an app-level action)." },
  { name = "TEXT_CHANGED", id = 4, summary = "P6 sub-step a2 (second half): a DG_NODE_TYPE_TEXT_FIELD's committed text changed - a real SDL_EVENT_TEXT_INPUT reached it, or an edit key (Backspace/Delete/arrow-with-selection-replace) mutated it. Carries only `window`/`node`, the SAME 'CLICK then ask' shape DG_EVENT_CLICK/dg_node_get_checked() already uses (design.md's own dg_event stays a pure-value POD, per abi/drawgui_abi.lock - no string field could live in it without breaking that): a caller reacting to this queries dg_node_get_text() rather than reading the new text out of the event itself." },
  { name = "WINDOW_RESIZED", id = 5, summary = "ABI 0.2: the window's drawable size changed; x/y carry the new width/height in device pixels. drawgui has already resized and repainted the window by the time this is polled. Not reported for a request that left the size unchanged." },
  { name = "WINDOW_MOVED", id = 6, summary = "ABI 0.2: the window moved; x/y carry the new top-left corner in logical screen coordinates (dg_window_get_position()'s units)." },
  { name = "WINDOW_MINIMIZED", id = 7, summary = "ABI 0.2: the window was minimized." },
  { name = "WINDOW_MAXIMIZED", id = 8, summary = "ABI 0.2: the window was maximized." },
  { name = "WINDOW_RESTORED", id = 9, summary = "ABI 0.2: the window returned to normal from minimized or maximized." },
  { name = "WINDOW_FOCUS_GAINED", id = 10, summary = "ABI 0.2: the window gained keyboard focus. Platforms (including the headless dummy driver) usually report this once right after dg_window_create()." },
  { name = "WINDOW_FOCUS_LOST", id = 11, summary = "ABI 0.2: the window lost keyboard focus." },
  { name = "WINDOW_FULLSCREEN_ENTERED", id = 12, summary = "ABI 0.2: the window became fullscreen." },
  { name = "WINDOW_FULLSCREEN_LEFT", id = 13, summary = "ABI 0.2: the window left fullscreen." },
  { name = "FOCUS_CHANGED", id = 14, summary = "ABI 0.2: keyboard focus inside `window` moved - a click, Tab/Shift+Tab, dg_node_focus()/dg_window_clear_focus(), or the focused node being disabled or removed. `node` is the newly focused node, or null when focus was cleared (or landed on a node without a handle). One event per change; the previous node is not reported." },
  { name = "TIMER", id = 15, summary = "ABI 0.2: a timer from dg_timer_add() fired; `x` carries its id (as int32_t; ids stay below 2^31). `window` and `node` are null. A repeating timer fires at most once per dg_wait_events()/dg_poll_events() pump even when late." },
  { name = "USER", id = 16, summary = "ABI 0.2: one dg_post_user_event() call; its 64-bit payload is split across `x` (low 32 bits) and `y` (high 32 bits): payload = ((uint64_t)(uint32_t)y << 32) | (uint32_t)x. `window` and `node` are null. dg_wake() queues no event." },
  { name = "CONTEXT_CLICK", id = 17, summary = "ABI 0.2: a secondary (right) button press. `node` is the nearest node under the pointer that has a handle (null over bare background), `x`/`y` the pointer position in device pixels, `clicks` the click count. Fires on the press, before any release; it does not focus or press anything." },
  { name = "LIST_SELECT", id = 18, summary = "ABI 0.2: a primary press (or, on a focused list, a navigation key) selected a row of a DG_NODE_TYPE_LIST. `node` is the list, `x` the row index, `y` 0, `clicks` the click count (2 for a double-click - the usual 'activate' gesture; 0 for a key)." },
  { name = "MENU_ACTIVATE", id = 19, summary = "ABI 0.2 phase B: an item of a dg_menu_open() menu was chosen (click or Enter); the menu has closed. `x` is the item index, `y` the menu id dg_menu_open() returned, `node` the anchor node passed to it (or null)." },
  { name = "MENU_DISMISS", id = 20, summary = "ABI 0.2 phase B: a dg_menu_open() menu closed without a choice (Escape, a click outside, or another dg_menu_open() replacing it). `y` is the menu id, `x` -1, `node` the anchor (or null). Not queued for dg_menu_close()." },
  { name = "VALUE_CHANGED", id = 21, summary = "ABI 0.2 phase B: the user chose a different option of a DG_NODE_TYPE_DROPDOWN. `node` is the dropdown, `x` the new index, `y` the previous one (-1 = none). Not queued for dg_dropdown_set_selected()." },
  { name = "DIALOG_RESULT", id = 22, summary = "ABI 0.2 phase B: a dg_dialog_open() dialog closed. `x` is the button index, or -1 for Escape without a cancel button; `y` the dialog id. Not queued for dg_dialog_close()." },
  { name = "TAB_SELECT", id = 23, summary = "ABI 0.2 phase B: the user selected a tab of a DG_NODE_TYPE_TABS. `node` is the tabs node, `x` the tab index." },
  { name = "TREE_SELECT", id = 24, summary = "ABI 0.2 phase B: the user selected an item of a DG_NODE_TYPE_TREE. `node` is the tree, `x` the item index (into dg_tree_set_items()' arrays)." },
  { name = "TREE_EXPAND", id = 25, summary = "ABI 0.2 phase B: the user expanded a tree item; `x` the item index." },
  { name = "TREE_COLLAPSE", id = 26, summary = "ABI 0.2 phase B: the user collapsed a tree item; `x` the item index." },
  { name = "TABLE_SELECT", id = 27, summary = "ABI 0.2 phase B: the user selected a row of a DG_NODE_TYPE_TABLE. `node` is the table, `x` the row index, `clicks` the click count for a pointer press (0 for a key)." },
  { name = "TABLE_SORT", id = 28, summary = "ABI 0.2 phase B: a sortable header of a DG_NODE_TYPE_TABLE was pressed. `x` is the column index. drawgui does not sort: the caller reorders its rows, calls dg_table_set_cells() and dg_table_set_sort_indicator()." },
  { name = "SLIDER_CHANGED", id = 29, summary = "ABI 0.2: the user moved a DG_NODE_TYPE_SLIDER to a different value (a press, a drag or a key). `node` is the slider; x/y are 0 - read the new value with dg_slider_get_value() (the 'CLICK then ask' shape DG_EVENT_TEXT_CHANGED uses: dg_event carries no float). One per change; not queued for DG_PROP_VALUE writes." },
  { name = "ROW_PART", id = 30, summary = "ABI 0.2: a press on a row's check box or trailing action button of a LIST (dg_list_set_rows()), TREE (dg_tree_set_items_ex()) or TABLE (dg_table_set_cells_ex()). `node` the component, `item` the row/item, `column` the table column (-1 elsewhere), `x` DG_ROW_PART_*, `y` the action index (-1 for a check box). A check box has already flipped - read it with dg_list_row_checked()/dg_tree_row_checked()/dg_table_cell_checked()." },
  { name = "CLOSE_REQUESTED", id = 31, summary = "ABI 0.2: the user asked to close a window with close confirmation on (dg_window_set_close_confirmation()); it is still open. dg_window_close() accepts; doing nothing refuses." },
  { name = "ANIMATION_FINISHED", id = 32, summary = "ABI 0.2: a dg_node_animate() animation reached its end. `node` is the animated node, `x` the id dg_node_animate() returned. Not queued for dg_animation_cancel(), a removed node, or a dg_node_set_transition() transition." },
]

